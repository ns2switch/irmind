[workspace]
members = ["."]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"

[package]
name = "irmind-evtx"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true

[dependencies]
evtx = { version = "=0.15.1", default-features = false }
serde_json = "1"
irmind-process-containment = { path = "../../crates/process-containment", version = "0.1.0", default-features = false }

[dev-dependencies]
irmind-domain = { path = "../../crates/domain", version = "0.1.0" }
irmind-infra = { path = "../../crates/infra", version = "0.1.0" }
irmind-security = { path = "../../crates/security", version = "0.1.0" }
ed25519-dalek = "2"
irmind-app = { path = "../../crates/app", version = "0.1.0" }
irmind-mod-parser-evtx = { path = "../../crates/modules/parser-evtx", version = "0.1.0" }
irmind-testkit = { path = "../../crates/testkit", version = "0.1.0" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
dead_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "warn"
cognitive_complexity = "warn"

[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false
