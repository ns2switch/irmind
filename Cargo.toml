[workspace]
members = ["crates/modules/query-azure-log-analytics", "crates/modules/query-bigquery", "crates/modules/query-athena", "crates/modules/parser-s3-access", "crates/modules/mapping-s3-access", "crates/modules/parser-elb", "crates/modules/mapping-elb", "crates/modules/parser-iis-w3c", "crates/modules/mapping-iis-w3c", "crates/modules/parser-windows-dns", "crates/modules/mapping-windows-dns", "crates/modules/parser-route53", "crates/modules/mapping-route53", "crates/modules/parser-github-audit", "crates/modules/mapping-github-audit", "crates/modules/mapping-google-workspace", "crates/modules/parser-google-workspace", "crates/modules/mapping-macos", "crates/modules/parser-macos", "crates/modules/mapping-fdr", "crates/modules/parser-fdr", "crates/modules/mapping-defender", "crates/modules/parser-defender", "crates/modules/mapping-email", "crates/modules/parser-email", "crates/modules/parser-azure-flow", "crates/modules/parser-gcp-flow", "crates/modules/mapping-cloud-flow", "crates/modules/parser-vpc-flow", "crates/modules/parser-guardduty", "crates/modules/mapping-guardduty", "crates/modules/mapping-identity", "crates/modules/parser-m365", "crates/modules/parser-okta", "crates/modules/mapping-gcp-audit", "crates/modules/mapping-entra", "crates/modules/parser-entra", "crates/modules/parser-gcp-audit", "crates/modules/mapping-kubernetes",
    "crates/modules/mapping-falco", "crates/modules/parser-kubernetes", "crates/modules/parser-falco", "crates/modules/siem-chronicle", "crates/modules/mapping-udm", "crates/modules/siem-elastic", "crates/modules/mapping-evtx", "crates/modules/mapping-linux",
    "crates/modules/mapping-ecs",
    "crates/modules/mapping-network", "crates/modules/mapping-syslog", "crates/modules/mapping-ocsf", "crates/modules/mapping-dfir", "crates/modules/mapping-cloudtrail", "crates/mapping-contracts", "crates/mapping-tables", "crates/modules/mapping-journald-compat", "crates/modules/mapping-json-compat", "crates/build-manifest", "crates/modules/parser-evtx", "crates/process-containment", "crates/calendar", "crates/domain", "crates/app", "crates/security", "crates/infra", "crates/fs", "crates/http", "crates/keystore-transfer", "crates/testkit", "crates/module-template", "crates/llm-chat-completions", "crates/modules/parser-json", "crates/modules/parser-syslog", "crates/modules/parser-linux", "crates/modules/parser-ecs", "crates/modules/parser-ocsf", "crates/modules/parser-velociraptor", "crates/modules/parser-hayabusa", "crates/modules/parser-chainsaw", "crates/modules/parser-plaso", "crates/modules/parser-eztools", "crates/modules/parser-declarative", "crates/modules/parser-zeek", "crates/modules/parser-suricata", "crates/modules/llm-openai-compatible", "crates/modules/llm-anthropic", "crates/modules/llm-deepseek", "crates/modules/llm-openrouter", "crates/modules/edr-crowdstrike", "crates/modules/edr-sentinelone", "crates/modules/ti-virustotal", "crates/modules/ti-misp", "crates/modules/siem-splunk", "crates/modules/cloud-aws", "crates/modules/storage-object", "crates/modules/keystore-os", "crates/modules/keystore-file", "crates/tui", "crates/bin"]
resolver = "3"
exclude = ["vendor/object_store", "vendor/arrow-array", "vendor/parquet", "helpers/evtx"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
dead_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.ci]
inherits = "test"
opt-level = 1
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
incremental = false

[patch.crates-io]
# Pin the reviewed 0.13.2 source with bounded metadata response collection.
object_store = { path = "vendor/object_store" }

arrow-array = { path = "vendor/arrow-array" }
parquet = { path = "vendor/parquet" }
