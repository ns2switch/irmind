[workspace]
members = ["crates/domain", "crates/app", "crates/security", "crates/infra", "crates/fs", "crates/http", "crates/keystore-transfer", "crates/parser-json", "crates/testkit", "crates/module-template", "crates/llm-chat-completions", "crates/modules/llm-openai-compatible", "crates/modules/llm-anthropic", "crates/modules/llm-deepseek", "crates/modules/llm-openrouter", "crates/modules/edr-crowdstrike", "crates/modules/edr-sentinelone", "crates/modules/ti-virustotal", "crates/modules/ti-misp", "crates/modules/siem-splunk", "crates/modules/cloud-aws", "crates/modules/storage-object", "crates/modules/keystore-os", "crates/modules/keystore-file", "crates/tui", "crates/bin"]
resolver = "3"
exclude = ["vendor/object_store"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
dead_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.ci]
inherits = "test"
debug = "line-tables-only"
incremental = false

[patch.crates-io]
# Pin the reviewed 0.13.2 source with bounded metadata response collection.
object_store = { path = "vendor/object_store" }
