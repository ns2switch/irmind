[package]
name = "irmind-infra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["persistent-keyring"]
persistent-keyring = ["keyring/linux-native-sync-persistent", "keyring/crypto-rust"]

[dependencies]
irmind-app = { path = "../app", version = "0.1.0" }
irmind-domain = { path = "../domain", version = "0.1.0" }
irmind-fs = { path = "../fs", version = "0.1.0" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
memchr = "2"
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }
rand = "0.8"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
serde_json = "1"
unicode-normalization = "=0.1.26"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
bytes = "1"
arrow = { version = "=59.3.0", default-features = false }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "snap"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs4 = "0.13"
toml = "0.9"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
irmind-mod-parser-ocsf = { path = "../modules/parser-ocsf", version = "0.1.0" }
irmind-mod-mapping-ocsf = { path = "../modules/mapping-ocsf", version = "0.1.0" }
irmind-mod-mapping-ecs = { path = "../modules/mapping-ecs", version = "0.1.0" }
irmind-mod-mapping-evtx = { path = "../modules/mapping-evtx", version = "0.1.0" }
irmind-mod-parser-ecs = { path = "../modules/parser-ecs", version = "0.1.0" }
irmind-mod-parser-evtx = { path = "../modules/parser-evtx", version = "0.1.0" }
irmind-mod-mapping-cloudtrail = { path = "../modules/mapping-cloudtrail", version = "0.1.0" }
irmind-mod-mapping-tables = { path = "../modules/mapping-tables", version = "0.1.0" }
irmind-mod-mapping-json-compat = { path = "../modules/mapping-json-compat", version = "0.1.0" }
irmind-mod-mapping-journald-compat = { path = "../modules/mapping-journald-compat", version = "0.1.0" }
irmind-mod-parser-linux = { path = "../modules/parser-linux", version = "0.1.0" }
irmind-security = { path = "../security", version = "0.1.0" }
irmind-mod-parser-json = { path = "../modules/parser-json", version = "0.1.0" }
irmind-testkit = { path = "../testkit", version = "0.1.0" }
futures-util = "0.3"

[lints]
workspace = true
