[[variants]]
product = "windows"
service = "defender"
category = "process_creation"
parser_id = "parser-defender"
parser_version = "defender-source-v1"
mapping_id = "mapping-defender"
mapping_version = "@defender-v1-"
dataset = "defender-hunting-process"
events = [
  { path = ["OSPlatform"], one_of = ["Windows", "Windows10", "Windows11", "WindowsServer2019", "WindowsServer2022", "WindowsServer2025"] },
  { column = "event.action", equals = "ProcessCreated" },
  { column = "event.category", equals = "process" },
  { column = "event.type", equals = "start" },
]
fields = [
  { name = "Image", path = ["FolderPath"], basename_path = ["FileName"], value_type = "text", conversion = "defender_full_path", null_policy = "absent" },
  { name = "ParentImage", path = ["InitiatingProcessFolderPath"], basename_path = ["InitiatingProcessFileName"], value_type = "text", conversion = "defender_full_path", null_policy = "absent" },
  { name = "CommandLine", path = ["ProcessCommandLine"], value_type = "text", null_policy = "absent" },
  { name = "ParentCommandLine", path = ["InitiatingProcessCommandLine"], value_type = "text", null_policy = "absent" },
  { name = "FileName", path = ["FileName"], value_type = "text", null_policy = "absent" },
  { name = "FolderPath", path = ["FolderPath"], value_type = "text", null_policy = "absent" },
  { name = "InitiatingProcessFileName", path = ["InitiatingProcessFileName"], value_type = "text", null_policy = "absent" },
  { name = "InitiatingProcessFolderPath", path = ["InitiatingProcessFolderPath"], value_type = "text", null_policy = "absent" },
  { name = "DeviceName", path = ["DeviceName"], value_type = "text", null_policy = "absent" },
  { name = "ActionType", path = ["ActionType"], value_type = "text", null_policy = "absent" },
]

