[[variants]]
product = "linux"
service = "sshd"
category = "authentication"
parser_id = "parser-linux"
parser_version = "linux-source-v1"
mapping_id = "mapping-linux-sshd"
mapping_version = "linux-sshd-tables-v1"
dataset = "sshd"
events = [
  { column = "event.action", equals = "sshd" },
  { column = "event.category", equals = "authentication" },
]
fields = [
  { name = "Hostname", column = "host.name", value_type = "text", null_policy = "absent" },
  { name = "User", column = "user.name", value_type = "text", null_policy = "absent" },
  { name = "TargetUser", column = "user.target.name", value_type = "text", null_policy = "absent" },
  { name = "Outcome", column = "event.outcome", value_type = "text", null_policy = "absent" },
  { name = "Message", path = ["syslog", "msg"], value_type = "text", null_policy = "absent" },
  { name = "Process", column = "process.name", value_type = "text", null_policy = "absent" },
  { name = "PID", column = "process.pid", value_type = "integer", null_policy = "absent" },
  { name = "SourceIP", column = "source.ip", value_type = "ip", null_policy = "absent" },
  { name = "SourcePort", column = "source.port", value_type = "integer", null_policy = "absent" },
  { name = "Verb", path = ["sshd", "verb"], value_type = "text", null_policy = "absent" },
  { name = "LoginUser", path = ["sshd", "user"], value_type = "text", null_policy = "absent" },
]

