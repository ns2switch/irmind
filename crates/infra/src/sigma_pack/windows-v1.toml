# Exact EVTX paths preserved by the parser. Native EventID and LogonType are text.

[[variants]]
product = "windows"
service = "security"
parser_id = "parser-evtx"
parser_version = "evtx-source-v1"
mapping_id = "mapping-evtx-security-4624"
mapping_version = "evtx-security-4624-tables-v1"
channel = "Security"
events = [
  { path = ["Event", "System", "Channel"], equals = "Security" },
  { path = ["Event", "System", "EventID"], one_of = ["4624"] },
]
fields = [
  { name = "EventID", path = ["Event", "System", "EventID"], value_type = "integer", conversion = "evtx_event_id", null_policy = "absent" },
  { name = "Channel", path = ["Event", "System", "Channel"], value_type = "text", null_policy = "absent" },
  { name = "Computer", column = "host.name", value_type = "text", null_policy = "absent" },
  { name = "SubjectUserName", path = ["Event", "EventData", "SubjectUserName"], value_type = "text", null_policy = "absent" },
  { name = "TargetUserName", path = ["Event", "EventData", "TargetUserName"], value_type = "text", null_policy = "absent" },
  { name = "LogonType", path = ["Event", "EventData", "LogonType"], value_type = "integer", conversion = "evtx_logon_type", null_policy = "absent" },
  { name = "IpAddress", path = ["Event", "EventData", "IpAddress"], value_type = "text", null_policy = "absent" },
  { name = "SourceIp", column = "source.ip", value_type = "ip", null_policy = "absent" },
]

