# W3C field names are explicit. The query token is retained separately by IIS.
[[variants]]
product = "windows"
service = "iis"
category = "webserver"
parser_id = "parser-iis-w3c"
parser_version = "iis-w3c-source-v1"
mapping_id = "mapping-iis-w3c"
mapping_version = "iis-w3c-tables-v1"
dataset = "iis-w3c"
events = [{ column = "event.category", equals = "web" }, { column = "event.type", equals = "access" }]
fields = [
  { name = "cs-method", column = "http.request.method", value_type = "text", null_policy = "absent" },
  { name = "cs-uri-stem", column = "url.path", value_type = "text", null_policy = "absent" },
  { name = "cs-uri-query", column = "url.query", value_type = "text", null_policy = "absent" },
  { name = "sc-status", column = "http.response.status_code", value_type = "integer", null_policy = "absent" },
  { name = "cs-user-agent", column = "user_agent.original", value_type = "text", null_policy = "absent" },
  { name = "cs-username", column = "user.name", value_type = "text", null_policy = "absent" },
  { name = "cs-host", column = "url.domain", value_type = "text", null_policy = "absent" },
  { name = "cs-referer", path = ["cs(Referer)"], value_type = "text", null_policy = "absent" },
  { name = "cs-content-type", path = ["cs(Content-Type)"], value_type = "text", null_policy = "absent" },
  { name = "c-ip", column = "source.ip", value_type = "ip", null_policy = "absent" },
]

