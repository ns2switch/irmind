[package]
name = "irmind"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["keystore-os", "keystore-file"]
keystore-os = ["dep:irmind-mod-keystore-os"]
keystore-file = ["dep:irmind-mod-keystore-file"]
persistent-keyring = ["irmind-infra/persistent-keyring"]
llm-anthropic = ["dep:irmind-mod-llm-anthropic"]
llm-deepseek = ["dep:irmind-mod-llm-deepseek"]
llm-openrouter = ["dep:irmind-mod-llm-openrouter"]
ti-virustotal = ["dep:irmind-mod-ti-virustotal"]
siem-splunk = ["dep:irmind-mod-siem-splunk"]
ti-misp = ["dep:irmind-mod-ti-misp"]
cloud-aws = ["dep:irmind-mod-cloud-aws"]
edr-crowdstrike = ["dep:irmind-mod-edr-crowdstrike"]
edr-sentinelone = ["dep:irmind-mod-edr-sentinelone"]

[dependencies]
irmind-app = { path = "../app", version = "0.1.0" }
irmind-tui = { path = "../tui", version = "0.1.0" }
irmind-domain = { path = "../domain", version = "0.1.0" }
irmind-security = { path = "../security", version = "0.1.0" }
irmind-infra = { path = "../infra", version = "0.1.0" }
irmind-fs = { path = "../fs", version = "0.1.0" }
irmind-mod-parser-json = { path = "../parser-json", version = "0.1.0" }
irmind-mod-llm-openai-compatible = { path = "../modules/llm-openai-compatible", version = "0.1.0" }
irmind-mod-keystore-os = { path = "../modules/keystore-os", version = "0.1.0", optional = true }
irmind-mod-keystore-file = { path = "../modules/keystore-file", version = "0.1.0", optional = true }
irmind-mod-llm-anthropic = { path = "../modules/llm-anthropic", version = "0.1.0", optional = true }
irmind-mod-llm-deepseek = { path = "../modules/llm-deepseek", version = "0.1.0", optional = true }
irmind-mod-llm-openrouter = { path = "../modules/llm-openrouter", version = "0.1.0", optional = true }
irmind-mod-ti-virustotal = { path = "../modules/ti-virustotal", version = "0.1.0", optional = true }
irmind-mod-siem-splunk = { path = "../modules/siem-splunk", version = "0.1.0", optional = true }
irmind-mod-ti-misp = { path = "../modules/ti-misp", version = "0.1.0", optional = true }
irmind-mod-cloud-aws = { path = "../modules/cloud-aws", version = "0.1.0", optional = true }
irmind-mod-edr-crowdstrike = { path = "../modules/edr-crowdstrike", version = "0.1.0", optional = true }
irmind-mod-edr-sentinelone = { path = "../modules/edr-sentinelone", version = "0.1.0", optional = true }
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "derive", "env"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
secrecy = "0.10"
directories = "6"
tokio = { version = "1", default-features = false, features = ["rt", "signal"] }
rpassword = "7.5"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

[[example]]
name = "demo"
required-features = ["keystore-file"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
