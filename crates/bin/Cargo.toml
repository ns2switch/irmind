[package]
name = "irmind"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = [
    "mapping-json-compat", "mapping-journald-compat", "mapping-cloudtrail", "mapping-linux", "mapping-ecs", "mapping-evtx", "mapping-dfir", "mapping-syslog", "mapping-network", "mapping-ocsf",
    "keystore-os", "keystore-file",
    "parser-json", "parser-syslog", "parser-linux", "parser-evtx",
    "parser-ecs", "parser-ocsf", "parser-declarative", "parser-kubernetes", "parser-falco",
    "parser-velociraptor", "parser-hayabusa", "parser-chainsaw", "parser-plaso", "parser-eztools",
    "parser-zeek", "parser-suricata",
    "llm-anthropic", "llm-deepseek", "llm-openrouter",
    "siem-splunk", "siem-elastic", "siem-chronicle", "cloud-aws", "edr-crowdstrike", "edr-sentinelone",
    "ti-misp", "ti-virustotal", "storage-s3", "storage-gcs", "storage-azure",
]
mapping-cloudtrail = ["dep:irmind-mod-mapping-cloudtrail", "parser-json"]
mapping-evtx = ["dep:irmind-mod-mapping-evtx", "parser-evtx"]
mapping-ocsf = ["dep:irmind-mod-mapping-ocsf", "parser-ocsf"]
mapping-network = ["dep:irmind-mod-mapping-network"]
mapping-syslog = ["dep:irmind-mod-mapping-syslog", "parser-syslog"]
mapping-dfir = ["dep:irmind-mod-mapping-dfir"]
mapping-ecs = ["dep:irmind-mod-mapping-ecs", "parser-ecs"]
mapping-linux = ["dep:irmind-mod-mapping-linux", "parser-linux"]
mapping-json-compat = ["dep:irmind-mod-mapping-json-compat", "parser-json"]
mapping-journald-compat = ["dep:irmind-mod-mapping-journald-compat", "parser-linux"]
keystore-os = ["dep:irmind-mod-keystore-os"]
keystore-file = ["dep:irmind-mod-keystore-file"]
parser-syslog = ["dep:irmind-mod-parser-syslog", "mapping-syslog"]
parser-evtx = ["dep:irmind-mod-parser-evtx", "mapping-evtx"]
parser-linux = ["dep:irmind-mod-parser-linux", "mapping-linux", "mapping-journald-compat"]
parser-json = ["dep:irmind-mod-parser-json", "mapping-json-compat"]
parser-kubernetes = ["dep:irmind-mod-parser-kubernetes"]
parser-falco = ["dep:irmind-mod-parser-falco"]
parser-declarative = ["dep:irmind-mod-parser-declarative"]
parser-ecs = ["dep:irmind-mod-parser-ecs", "mapping-ecs"]
parser-ocsf = ["dep:irmind-mod-parser-ocsf", "mapping-ocsf"]
parser-velociraptor = ["dep:irmind-mod-parser-velociraptor", "mapping-dfir"]
parser-hayabusa = ["dep:irmind-mod-parser-hayabusa", "mapping-dfir"]
parser-chainsaw = ["dep:irmind-mod-parser-chainsaw", "mapping-dfir"]
parser-plaso = ["dep:irmind-mod-parser-plaso", "mapping-dfir"]
parser-eztools = ["dep:irmind-mod-parser-eztools", "mapping-dfir"]
parser-zeek = ["dep:irmind-mod-parser-zeek", "mapping-network"]
parser-suricata = ["dep:irmind-mod-parser-suricata", "mapping-network"]
llm-anthropic = ["dep:irmind-mod-llm-anthropic"]
llm-deepseek = ["dep:irmind-mod-llm-deepseek"]
llm-openrouter = ["dep:irmind-mod-llm-openrouter"]
ti-virustotal = ["dep:irmind-mod-ti-virustotal"]
siem-splunk = ["dep:irmind-mod-siem-splunk"]
siem-chronicle = ["dep:irmind-mod-siem-chronicle", "dep:irmind-mod-mapping-udm"]
siem-elastic = ["dep:irmind-mod-siem-elastic", "mapping-ecs"]
ti-misp = ["dep:irmind-mod-ti-misp"]
cloud-aws = ["dep:irmind-mod-cloud-aws"]
edr-crowdstrike = ["dep:irmind-mod-edr-crowdstrike"]
edr-sentinelone = ["dep:irmind-mod-edr-sentinelone"]
storage-s3 = ["dep:irmind-mod-storage-object", "irmind-mod-storage-object/s3"]
storage-gcs = ["dep:irmind-mod-storage-object", "irmind-mod-storage-object/gcs"]
storage-azure = ["dep:irmind-mod-storage-object", "irmind-mod-storage-object/azure"]

[dependencies]
irmind-mod-parser-kubernetes = { path = "../modules/parser-kubernetes", version = "0.1.0", optional = true }
irmind-mod-parser-falco = { path = "../modules/parser-falco", version = "0.1.0", optional = true }
irmind-mod-mapping-ocsf = { path = "../modules/mapping-ocsf", version = "0.1.0", optional = true }
irmind-mod-mapping-network = { path = "../modules/mapping-network", version = "0.1.0", optional = true }
irmind-mod-mapping-syslog = { path = "../modules/mapping-syslog", version = "0.1.0", optional = true }
irmind-mod-mapping-evtx = { path = "../modules/mapping-evtx", version = "0.1.0", optional = true }
irmind-mod-mapping-cloudtrail = { path = "../modules/mapping-cloudtrail", version = "0.1.0", optional = true }
irmind-mod-mapping-dfir = { path = "../modules/mapping-dfir", version = "0.1.0", optional = true }
irmind-mod-mapping-ecs = { path = "../modules/mapping-ecs", version = "0.1.0", optional = true }
irmind-mod-mapping-linux = { path = "../modules/mapping-linux", version = "0.1.0", optional = true }
irmind-mod-mapping-json-compat = { path = "../modules/mapping-json-compat", version = "0.1.0", optional = true }
irmind-mod-mapping-journald-compat = { path = "../modules/mapping-journald-compat", version = "0.1.0", optional = true }
irmind-mod-parser-evtx = { path = "../modules/parser-evtx", version = "0.1.0", optional = true }
irmind-app = { path = "../app", version = "0.1.0" }
irmind-http = { path = "../http", version = "0.1.0" }
irmind-tui = { path = "../tui", version = "0.4.1" }
irmind-domain = { path = "../domain", version = "0.1.0" }
irmind-security = { path = "../security", version = "0.1.0" }
irmind-infra = { path = "../infra", version = "0.1.0" }
irmind-fs = { path = "../fs", version = "0.1.0" }
irmind-mod-parser-linux = { path = "../modules/parser-linux", version = "0.1.0", optional = true }
irmind-mod-parser-syslog = { path = "../modules/parser-syslog", version = "0.1.0", optional = true }
irmind-mod-parser-json = { path = "../modules/parser-json", version = "0.1.0", optional = true }
irmind-mod-parser-declarative = { path = "../modules/parser-declarative", version = "0.1.0", optional = true }
irmind-mod-parser-ecs = { path = "../modules/parser-ecs", version = "0.1.0", optional = true }
irmind-mod-parser-ocsf = { path = "../modules/parser-ocsf", version = "0.1.0", optional = true }
irmind-mod-parser-velociraptor = { path = "../modules/parser-velociraptor", version = "0.1.0", optional = true }
irmind-mod-parser-hayabusa = { path = "../modules/parser-hayabusa", version = "0.1.0", optional = true }
irmind-mod-parser-chainsaw = { path = "../modules/parser-chainsaw", version = "0.1.0", optional = true }
irmind-mod-parser-plaso = { path = "../modules/parser-plaso", version = "0.1.0", optional = true }
irmind-mod-parser-eztools = { path = "../modules/parser-eztools", version = "0.1.0", optional = true }
irmind-mod-parser-zeek = { path = "../modules/parser-zeek", version = "0.1.0", optional = true }
irmind-mod-parser-suricata = { path = "../modules/parser-suricata", version = "0.1.0", optional = true }
irmind-mod-llm-openai-compatible = { path = "../modules/llm-openai-compatible", version = "0.1.0" }
irmind-mod-keystore-os = { path = "../modules/keystore-os", version = "0.1.0", optional = true }
irmind-mod-keystore-file = { path = "../modules/keystore-file", version = "0.1.0", optional = true }
irmind-mod-llm-anthropic = { path = "../modules/llm-anthropic", version = "0.1.0", optional = true }
irmind-mod-llm-deepseek = { path = "../modules/llm-deepseek", version = "0.1.0", optional = true }
irmind-mod-llm-openrouter = { path = "../modules/llm-openrouter", version = "0.1.0", optional = true }
irmind-mod-ti-virustotal = { path = "../modules/ti-virustotal", version = "0.1.0", optional = true }
irmind-mod-siem-chronicle = { path = "../modules/siem-chronicle", version = "0.1.0", optional = true }
irmind-mod-mapping-udm = { path = "../modules/mapping-udm", version = "0.1.0", optional = true }
irmind-mod-siem-elastic = { path = "../modules/siem-elastic", version = "0.1.0", optional = true }
irmind-mod-siem-splunk = { path = "../modules/siem-splunk", version = "0.1.0", optional = true }
irmind-mod-ti-misp = { path = "../modules/ti-misp", version = "0.1.0", optional = true }
irmind-mod-cloud-aws = { path = "../modules/cloud-aws", version = "0.1.0", optional = true }
irmind-mod-edr-crowdstrike = { path = "../modules/edr-crowdstrike", version = "0.1.0", optional = true }
irmind-mod-edr-sentinelone = { path = "../modules/edr-sentinelone", version = "0.1.0", optional = true }
irmind-mod-storage-object = { path = "../modules/storage-object", version = "0.1.0", optional = true }
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "derive", "env"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
secrecy = "0.10"
directories = "6"
tokio = { version = "1", default-features = false, features = ["rt", "signal"] }
rpassword = "7.5"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
irmind-mod-mapping-json-compat = { path = "../modules/mapping-json-compat", version = "0.1.0" }
irmind-mod-mapping-journald-compat = { path = "../modules/mapping-journald-compat", version = "0.1.0" }
irmind-testkit = { path = "../testkit", version = "0.1.0" }
ed25519-dalek = "2"
arrow = { version = "=59.3.0", default-features = false }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "snap"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
portable-pty = "=0.9.0"

[[example]]
name = "demo"
required-features = ["keystore-file", "parser-json"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
