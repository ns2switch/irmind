[package]
name = "irmind-native-approval"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["std", "Security_Credentials_UI", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["LAContext", "LABase", "LABiometryType", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSError"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
block2 = { version = "=0.6.2", default-features = false, features = ["alloc"] }

[lints]
workspace = true
