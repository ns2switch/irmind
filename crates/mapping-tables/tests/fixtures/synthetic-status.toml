interpreter = "irmind-mapping-tables-v2"
id = "mapping-synthetic-status"
version = "1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-json"
parser_versions = ["json-source-v1"]

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "failure"
[[rules.when]]
path = ["status"]
predicate = { op = "text", value = "failed" }

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "success"
[[rules.when]]
path = ["status"]
predicate = { op = "text", value = "accepted" }

[[fields]]
source = ["client"]
target = "source.ip"
conversion = "ip"
observation = { kind = "ip", role = "source", scope = { kind = "global" } }
[[fields]]
source = ["server"]
target = "destination.ip"
conversion = "ip"
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }
