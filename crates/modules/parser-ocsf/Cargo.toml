[package]
name = "irmind-mod-parser-ocsf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
irmind-app = { path = "../../app", version = "0.1.0" }
irmind-domain = { path = "../../domain", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "snap", "json"] }
tempfile = "3"

[lints]
workspace = true

[dev-dependencies]
arrow = { version = "=59.3.0", default-features = false }
