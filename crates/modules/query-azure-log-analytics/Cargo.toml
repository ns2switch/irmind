[package]
name = "irmind-mod-query-azure-log-analytics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
irmind-app = { path = "../../app", version = "0.1.0" }
irmind-calendar = { path = "../../calendar", version = "0.1.0" }
irmind-domain = { path = "../../domain", version = "0.1.0" }
irmind-http = { path = "../../http", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", default-features = false, features = ["macros"] }
uuid = "1"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "2"
irmind-infra = { path = "../../infra", version = "0.1.0" }
irmind-security = { path = "../../security", version = "0.1.0" }
tempfile = "3"
irmind-mod-mapping-entra = { path = "../mapping-entra", version = "0.1.0" }
irmind-mod-parser-entra = { path = "../parser-entra", version = "0.1.0" }
irmind-testkit = { path = "../../testkit", version = "0.1.0" }

[lints]
workspace = true
