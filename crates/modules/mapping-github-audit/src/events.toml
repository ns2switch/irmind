interpreter = "irmind-mapping-tables-v2"
id = "mapping-github-audit"
version = "github-audit-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-github-audit"
parser_versions = ["github-audit-source-v1"]
action = ["action"]

[[fields]]
source = ["actor"]
target = "user.name"
omit_text = [""]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["user"]
target = "user.target.name"
omit_text = [""]
observation = { kind = "user", role = "target", scope = { kind = "source_record" } }

[[fields]]
source = ["actor_ip"]
target = "source.ip"
omit_text = [""]
conversion = "ip"
observation = { kind = "ip", role = "source", scope = { kind = "source_record" } }

[[fields]]
source = ["org"]
target = "cloud.account.id"
omit_text = [""]

[[fields]]
source = ["repo"]
target = "irmind.resource.id"
omit_text = [""]
observation = { kind = "resource", role = "target", scope = { kind = "source_record" } }

[[fields]]
source = ["_document_id"]
target = "irmind.source_event.id"
omit_text = [""]

[[fields]]
source = ["user_agent"]
target = "user_agent.original"
omit_text = [""]

