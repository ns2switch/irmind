interpreter = "irmind-mapping-tables-v2"
id = "google-workspace-native-events"
version = "google-workspace-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-google-workspace"
parser_versions = ["google-workspace-source-v1"]
format = "google-workspace-activity"
format_version = "google-workspace-source-v1"
action = ["event", "name"]

[[fields]]
source = ["activity", "id", "applicationName"]
target = "cloud.service.name"

[[fields]]
source = ["activity", "id", "customerId"]
target = "cloud.account.id"

[[fields]]
source = ["activity", "actor", "email"]
target = "user.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["activity", "actor", "profileId"]
target = "user.id"
omit_text = ["", "105250506097979753968"]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["activity", "ipAddress"]
target = "source.ip"
omit_text = ["", "-"]
conversion = "ip"
observation = { kind = "ip", role = "source", scope = { kind = "source_record" } }

[[rules]]
