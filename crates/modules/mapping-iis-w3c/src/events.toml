interpreter = "irmind-mapping-tables-v2"
id = "mapping-iis-w3c"
version = "iis-w3c-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-iis-w3c"
parser_versions = ["iis-w3c-source-v1"]
format = "iis-w3c"
format_version = "iis-w3c-source-v1"
action = ["cs-method"]

[partition]
host = ["s-computername"]

[[fields]]
source = ["cs-method"]
target = "http.request.method"
omit_text = ["-"]

[[fields]]
source = ["cs-uri-stem"]
target = "url.path"
omit_text = ["-"]

[[fields]]
source = ["cs-uri-query"]
target = "url.query"
omit_text = ["-"]

[[fields]]
source = ["cs(User-Agent)"]
target = "user_agent.original"
omit_text = ["-"]

[[fields]]
source = ["cs-version"]
target = "http.version"
omit_text = ["-"]

[[fields]]
source = ["sc-status"]
target = "http.response.status_code"
omit_text = ["-"]

[[fields]]
source = ["cs-bytes"]
target = "http.request.bytes"
omit_text = ["-"]

[[fields]]
source = ["sc-bytes"]
target = "http.response.bytes"
omit_text = ["-"]

[[fields]]
source = ["c-ip"]
target = "source.ip"
omit_text = ["-"]
conversion = "ip"
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[fields]]
source = ["s-ip"]
target = "destination.ip"
omit_text = ["-"]
conversion = "ip"
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }

[[fields]]
source = ["s-computername"]
target = "host.name"
omit_text = ["-"]
observation = { kind = "host", role = "observer", scope = { kind = "source_record" } }

[[fields]]
source = ["s-port"]
target = "destination.port"
omit_text = ["-"]

[[fields]]
source = ["cs-username"]
target = "user.name"
omit_text = ["-"]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["cs-host"]
target = "url.domain"
omit_text = ["-"]

[[rules]]
categories = ["web"]
types = ["access"]
outcome = "unknown"
[[rules.when]]
path = ["sc-status"]
predicate = { op = "integer_interval", value = { first = 100, last = 199 } }

[[rules]]
categories = ["web"]
types = ["access"]
outcome = "success"
[[rules.when]]
path = ["sc-status"]
predicate = { op = "integer_interval", value = { first = 200, last = 399 } }

[[rules]]
categories = ["web"]
types = ["access"]
outcome = "failure"
[[rules.when]]
path = ["sc-status"]
predicate = { op = "integer_interval", value = { first = 400, last = 599 } }

[[rules]]
categories = ["web"]
types = ["access"]
[[rules.when]]
path = ["sc-status"]
predicate = { op = "missing" }

[[rules]]
categories = ["web"]
types = ["access"]
[[rules.when]]
path = ["sc-status"]
predicate = { op = "text", value = "-" }
