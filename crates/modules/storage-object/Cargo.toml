[package]
name = "irmind-mod-storage-object"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
s3 = ["object_store/aws"]
gcs = ["object_store/gcp"]
azure = ["object_store/azure"]

[dependencies]
irmind-app = { path = "../../app", version = "0.1.0" }
irmind-domain = { path = "../../domain", version = "0.1.0" }
irmind-http = { path = "../../http", version = "0.1.0" }
object_store = { version = "=0.13.2", default-features = false }
futures-util = "0.3"
secrecy = "0.10"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
url = "2"

[lints]
workspace = true

[dev-dependencies]
irmind-testkit = { path = "../../testkit", version = "0.1.0" }
