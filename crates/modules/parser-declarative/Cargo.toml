[package]
name = "irmind-mod-parser-declarative"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
irmind-app = { path = "../../app", version = "0.1.0" }
irmind-domain = { path = "../../domain", version = "0.1.0" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.9"

[lints]
workspace = true

[dev-dependencies]
irmind-testkit = { path = "../../testkit", version = "0.1.0" }

[build-dependencies]
irmind-build-manifest = { path = "../../build-manifest", version = "0.1.0" }
