interpreter = "irmind-mapping-tables-v2"
id = "mapping-elb"
version = "elb-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-elb"
parser_versions = ["elb-source-v1"]
format = "aws-elb-access"
format_version = "elb-source-v1"
action = ["request_method"]

[[fields]]
source = ["request_method"]
target = "http.request.method"
omit_text = ["-"]

[[fields]]
source = ["request_target"]
target = "url.original"
omit_text = ["-"]

[[fields]]
source = ["request_path"]
target = "url.path"
omit_text = ["-"]

[[fields]]
source = ["request_query"]
target = "url.query"
omit_text = ["-"]

[[fields]]
source = ["request_http_version"]
target = "http.version"
omit_text = ["-"]

[[fields]]
source = ["user_agent"]
target = "user_agent.original"
omit_text = ["-"]

[[fields]]
source = ["elb_status_code"]
target = "http.response.status_code"
omit_text = ["-"]

[[fields]]
source = ["received_bytes"]
target = "http.request.bytes"
omit_text = ["-"]

[[fields]]
source = ["sent_bytes"]
target = "http.response.bytes"
omit_text = ["-"]

[[fields]]
source = ["client_ip"]
target = "source.ip"
omit_text = ["-"]
conversion = "ip"
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[fields]]
source = ["client_port"]
target = "source.port"
omit_text = ["-"]

[[fields]]
source = ["backend_ip"]
target = "destination.ip"
omit_text = ["-"]
conversion = "ip"
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }

[[fields]]
source = ["backend_port"]
target = "destination.port"
omit_text = ["-"]

[[fields]]
source = ["elb"]
target = "irmind.resource.id"
omit_text = ["-"]
observation = { kind = "resource", role = "observer", scope = { kind = "source_record" } }

[[rules]]
categories = ["web"]
types = ["access"]
outcome = "unknown"
[[rules.when]]
path = ["elb_status_code"]
predicate = { op = "integer_interval", value = { first = 100, last = 199 } }

[[rules]]
categories = ["web"]
types = ["access"]
outcome = "success"
[[rules.when]]
path = ["elb_status_code"]
predicate = { op = "integer_interval", value = { first = 200, last = 399 } }

[[rules]]
categories = ["web"]
types = ["access"]
outcome = "failure"
[[rules.when]]
path = ["elb_status_code"]
predicate = { op = "integer_interval", value = { first = 400, last = 599 } }

[[rules]]
categories = ["network"]
types = ["connection"]
[[rules.when]]
path = ["elb_status_code"]
predicate = { op = "text", value = "-" }
