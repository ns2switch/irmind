interpreter = "irmind-mapping-tables-v2"
id = "mapping-macos-exec"
version = "macos-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-macos"
parser_versions = ["macos-source-v1"]
format = "macos-eslogger"
format_version = "1"
native_type = "exec"

[[when]]
path = ["action_type"]
predicate = { op = "number", value = "1" }

[[fields]]
source = ["event", "exec", "target", "executable", "path"]
target = "process.executable"
omit_text = ["", "-", "<private>"]

[[fields]]
source = ["event", "exec", "target", "audit_token", "pid"]
target = "process.pid"
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["event", "exec", "target", "ppid"]
target = "process.parent.pid"
observation = { kind = "process", role = "parent", scope = { kind = "source_record" } }

[[rules]]
categories = ["process"]
types = ["start"]
outcome = "unknown"
