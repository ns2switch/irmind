interpreter = "irmind-mapping-tables-v2"
id = "mapping-macos-login-login"
version = "macos-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-macos"
parser_versions = ["macos-source-v1"]
format = "macos-eslogger"
format_version = "1"
native_type = "login_login"

[[when]]
path = ["action_type"]
predicate = { op = "number", value = "1" }

[[fields]]
source = ["process", "executable", "path"]
target = "process.executable"
omit_text = ["", "-", "<private>"]

[[fields]]
source = ["process", "audit_token", "pid"]
target = "process.pid"
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["process", "ppid"]
target = "process.parent.pid"
observation = { kind = "process", role = "parent", scope = { kind = "source_record" } }

[[fields]]
source = ["event", "login_login", "username"]
target = "user.target.name"
omit_text = ["", "-", "<private>"]
observation = { kind = "user", role = "target", scope = { kind = "source_record" } }

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "success"
[[rules.when]]
path = ["event", "login_login", "success"]
predicate = { op = "boolean", value = true }

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "failure"
[[rules.when]]
path = ["event", "login_login", "success"]
predicate = { op = "boolean", value = false }

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "unknown"
[[rules.when]]
path = ["event", "login_login", "success"]
predicate = { op = "missing" }

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "unknown"
[[rules.when]]
path = ["event", "login_login", "success"]
predicate = { op = "null" }
