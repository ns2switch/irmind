interpreter = "irmind-mapping-tables-v2"
# Original CloudTrail fields; finite operation/outcome tables, no source inference.
id = "mapping-cloudtrail"
version = "cloudtrail-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-json"
parser_versions = ["json-source-v1"]
format = "json"
format_version = "source-json-v1"
action = ["eventName"]

[[when]]
path = ["eventVersion"]
predicate = { op = "present" }

[partition]
account = ["recipientAccountId"]
region = ["awsRegion"]

[[fields]]
source = ["recipientAccountId"]
target = "cloud.account.id"
observation = { kind = "account", role = "subject", scope = { kind = "account", path = ["recipientAccountId"] } }

[[fields]]
source = ["awsRegion"]
target = "cloud.region"

[[fields]]
source = ["eventSource"]
target = "cloud.service.name"

[[fields]]
source = ["userIdentity", "principalId"]
target = "user.id"
observation = { kind = "user", role = "actor", scope = { kind = "account", path = ["userIdentity", "accountId"] } }

[[fields]]
source = ["userIdentity", "userName"]
target = "user.name"
observation = { kind = "user", role = "actor", scope = { kind = "account", path = ["userIdentity", "accountId"] } }

[[fields]]
source = ["requestParameters", "userName"]
target = "user.target.name"
observation = { kind = "user", role = "target", scope = { kind = "account", path = ["recipientAccountId"] } }

[[fields]]
source = ["requestParameters", "roleArn"]
target = "irmind.iam_role.id"
observation = { kind = "role", role = "target", scope = { kind = "account", path = ["recipientAccountId"] } }

[[fields]]
source = ["requestParameters", "policyArn"]
target = "irmind.resource.id"
observation = { kind = "resource", role = "target", scope = { kind = "account", path = ["recipientAccountId"] } }

[[fields]]
source = ["sourceIPAddress"]
target = "source.ip"
conversion = "ip"
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[fields]]
source = ["userAgent"]
target = "user_agent.original"

[[fields]]
source = ["eventID"]
target = "irmind.source_event.id"
observation = { kind = "event", role = "subject", scope = { kind = "source_record" } }

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "success"
[[rules.when]]
path = ["eventSource"]
predicate = { op = "text", value = "signin.amazonaws.com" }
[[rules.when]]
path = ["eventName"]
predicate = { op = "text", value = "ConsoleLogin" }
[[rules.when]]
path = ["responseElements", "ConsoleLogin"]
predicate = { op = "text", value = "Success" }

