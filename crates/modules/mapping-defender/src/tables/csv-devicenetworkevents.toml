[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "InboundConnectionAccepted" }

[[fields]]
source = ["RemotePort"]
target = "source.port"
omit_text = ["", "-"]
conversion = "decimal"
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "InboundConnectionAccepted" }

[[fields]]
source = ["InitiatingProcessMD5"]
target = "process.hash.md5"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessSHA1"]
target = "process.hash.sha1"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessSHA256"]
target = "process.hash.sha256"
omit_text = ["", "-"]

