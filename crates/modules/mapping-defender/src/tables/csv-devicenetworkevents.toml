interpreter = "irmind-mapping-tables-v2"
id = "mde-csv-devicenetworkevents"
version = "defender-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-defender"
parser_versions = ["defender-source-v1"]
format = "mde-csv"
format_version = "defender-source-v1"
native_type = "DeviceNetworkEvents"
action = ["ActionType"]

[partition]
host = ["DeviceId"]

[[fields]]
source = ["DeviceId"]
target = "host.id"
omit_text = ["", "-"]
observation = { kind = "host", role = "observer", scope = { kind = "source_record" } }

[[fields]]
source = ["DeviceName"]
target = "host.name"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessAccountName"]
target = "user.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["InitiatingProcessAccountDomain"]
target = "user.domain"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessId"]
target = "process.pid"
omit_text = ["", "-"]
conversion = "decimal"
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["InitiatingProcessFileName"]
target = "process.name"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessCommandLine"]
target = "process.command_line"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessParentId"]
target = "process.parent.pid"
omit_text = ["", "-"]
conversion = "decimal"
observation = { kind = "process", role = "parent", scope = { kind = "source_record" } }

[[fields]]
source = ["InitiatingProcessParentFileName"]
target = "process.parent.name"
omit_text = ["", "-"]

[[fields]]
source = ["LocalIP"]
target = "source.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "source", scope = { kind = "global" } }
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ConnectionSuccess" }

[[fields]]
source = ["LocalPort"]
target = "source.port"
omit_text = ["", "-"]
conversion = "decimal"
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ConnectionSuccess" }

[[fields]]
source = ["RemoteIP"]
target = "destination.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ConnectionSuccess" }

[[fields]]
source = ["RemotePort"]
target = "destination.port"
omit_text = ["", "-"]
conversion = "decimal"
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ConnectionSuccess" }

[[fields]]
source = ["LocalIP"]
target = "source.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "source", scope = { kind = "global" } }
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ConnectionFailed" }

[[fields]]
source = ["LocalPort"]
target = "source.port"
omit_text = ["", "-"]
conversion = "decimal"
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ConnectionFailed" }

[[fields]]
source = ["RemoteIP"]
target = "destination.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ConnectionFailed" }

[[fields]]
source = ["RemotePort"]
target = "destination.port"
omit_text = ["", "-"]
conversion = "decimal"
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ConnectionFailed" }

[[fields]]
source = ["LocalIP"]
target = "destination.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "InboundConnectionAccepted" }

[[fields]]
source = ["LocalPort"]
target = "destination.port"
omit_text = ["", "-"]
conversion = "decimal"
[[fields.when]]
path = ["ActionType"]
predicate = { op = "text", value = "InboundConnectionAccepted" }

