interpreter = "irmind-mapping-tables-v2"
id = "mde-csv-deviceimageloadevents"
version = "defender-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-defender"
parser_versions = ["defender-source-v1"]
format = "mde-csv"
format_version = "defender-source-v1"
native_type = "DeviceImageLoadEvents"
action = ["ActionType"]

[partition]
host = ["DeviceId"]

[[fields]]
source = ["DeviceId"]
target = "host.id"
omit_text = ["", "-"]
observation = { kind = "host", role = "observer", scope = { kind = "source_record" } }

[[fields]]
source = ["DeviceName"]
target = "host.name"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessAccountName"]
target = "user.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["InitiatingProcessAccountDomain"]
target = "user.domain"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessId"]
target = "process.pid"
omit_text = ["", "-"]
conversion = "decimal"
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["InitiatingProcessFileName"]
target = "process.name"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessCommandLine"]
target = "process.command_line"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessParentId"]
target = "process.parent.pid"
omit_text = ["", "-"]
conversion = "decimal"
observation = { kind = "process", role = "parent", scope = { kind = "source_record" } }

[[fields]]
source = ["InitiatingProcessParentFileName"]
target = "process.parent.name"
omit_text = ["", "-"]

[[fields]]
source = ["FileName"]
target = "file.name"
omit_text = ["", "-"]
observation = { kind = "file", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["FileSize"]
target = "file.size"
omit_text = ["", "-"]
conversion = "decimal"

[[fields]]
source = ["MD5"]
target = "file.hash.md5"
omit_text = ["", "-"]
observation = { kind = "hash", role = "subject", scope = { kind = "global" } }

[[fields]]
source = ["SHA1"]
target = "file.hash.sha1"
omit_text = ["", "-"]
observation = { kind = "hash", role = "subject", scope = { kind = "global" } }

[[fields]]
source = ["SHA256"]
target = "file.hash.sha256"
omit_text = ["", "-"]
observation = { kind = "hash", role = "subject", scope = { kind = "global" } }

[[fields]]
source = ["InitiatingProcessMD5"]
target = "process.hash.md5"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessSHA1"]
target = "process.hash.sha1"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessSHA256"]
target = "process.hash.sha256"
omit_text = ["", "-"]

[[rules]]
categories = ["library"]
types = ["start"]
outcome = "success"
[[rules.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ImageLoaded" }
