interpreter = "irmind-mapping-tables-v2"
id = "mde-stream-devicenetworkevents"
version = "defender-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-defender"
parser_versions = ["defender-source-v1"]
format = "mde-stream"
format_version = "defender-source-v1"
native_type = "DeviceNetworkEvents"
action = ["properties", "ActionType"]

[partition]
host = ["properties", "DeviceId"]

[[fields]]
source = ["properties", "DeviceId"]
target = "host.id"
omit_text = ["", "-"]
observation = { kind = "host", role = "observer", scope = { kind = "host", path = ["properties", "DeviceId"] } }

[[fields]]
source = ["properties", "DeviceName"]
target = "host.name"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessAccountName"]
target = "user.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["properties", "InitiatingProcessAccountDomain"]
target = "user.domain"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessId"]
target = "process.pid"
omit_text = ["", "-"]
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["properties", "InitiatingProcessFileName"]
target = "process.name"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessCommandLine"]
target = "process.command_line"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessParentId"]
target = "process.parent.pid"
omit_text = ["", "-"]
observation = { kind = "process", role = "parent", scope = { kind = "source_record" } }

[[fields]]
source = ["properties", "InitiatingProcessParentFileName"]
target = "process.parent.name"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessMD5"]
target = "process.hash.md5"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessSHA1"]
target = "process.hash.sha1"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessSHA256"]
target = "process.hash.sha256"
omit_text = ["", "-"]

[[rules]]
categories = ["network"]
types = ["connection"]
outcome = "success"
[[rules.when]]
path = ["properties", "ActionType"]
predicate = { op = "text", value = "ConnectionSuccess" }

[[rules.fields]]

source = ["properties", "LocalIP"]
target = "source.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[rules.fields]]

source = ["properties", "LocalPort"]
target = "source.port"
omit_text = ["", "-"]

[[rules.fields]]

source = ["properties", "RemoteIP"]
target = "destination.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }

[[rules.fields]]

source = ["properties", "RemotePort"]
target = "destination.port"
omit_text = ["", "-"]

[[rules]]
categories = ["network"]
types = ["connection"]
outcome = "failure"
[[rules.when]]
path = ["properties", "ActionType"]
predicate = { op = "text", value = "ConnectionFailed" }

[[rules.fields]]

source = ["properties", "LocalIP"]
target = "source.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[rules.fields]]

source = ["properties", "LocalPort"]
target = "source.port"
omit_text = ["", "-"]

[[rules.fields]]

source = ["properties", "RemoteIP"]
target = "destination.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }

[[rules.fields]]

source = ["properties", "RemotePort"]
target = "destination.port"
omit_text = ["", "-"]

[[rules]]
categories = ["network"]
types = ["connection"]
outcome = "success"
[[rules.when]]
path = ["properties", "ActionType"]
predicate = { op = "text", value = "InboundConnectionAccepted" }

[[rules.fields]]

source = ["properties", "LocalIP"]
target = "destination.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }

[[rules.fields]]

source = ["properties", "LocalPort"]
target = "destination.port"
omit_text = ["", "-"]

[[rules.fields]]

source = ["properties", "RemoteIP"]
target = "source.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[rules.fields]]

source = ["properties", "RemotePort"]
target = "source.port"
omit_text = ["", "-"]
