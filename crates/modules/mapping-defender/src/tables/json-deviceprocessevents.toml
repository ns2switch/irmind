interpreter = "irmind-mapping-tables-v2"
id = "mde-json-deviceprocessevents"
version = "defender-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-defender"
parser_versions = ["defender-source-v1"]
format = "mde-json"
format_version = "defender-source-v1"
native_type = "DeviceProcessEvents"
action = ["ActionType"]

[partition]
host = ["DeviceId"]

[[fields]]
source = ["DeviceId"]
target = "host.id"
omit_text = ["", "-"]
observation = { kind = "host", role = "observer", scope = { kind = "host", path = ["DeviceId"] } }

[[fields]]
source = ["DeviceName"]
target = "host.name"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessAccountName"]
target = "user.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["InitiatingProcessAccountDomain"]
target = "user.domain"
omit_text = ["", "-"]

[[fields]]
source = ["AccountName"]
target = "user.target.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "target", scope = { kind = "source_record" } }

[[fields]]
source = ["AccountDomain"]
target = "user.target.domain"
omit_text = ["", "-"]

[[fields]]
source = ["ProcessId"]
target = "process.pid"
omit_text = ["", "-"]
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["FileName"]
target = "process.name"
omit_text = ["", "-"]

[[fields]]
source = ["ProcessCommandLine"]
target = "process.command_line"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessId"]
target = "process.parent.pid"
omit_text = ["", "-"]
observation = { kind = "process", role = "parent", scope = { kind = "source_record" } }

[[fields]]
source = ["InitiatingProcessFileName"]
target = "process.parent.name"
omit_text = ["", "-"]

[[fields]]
source = ["InitiatingProcessCommandLine"]
target = "process.parent.command_line"
omit_text = ["", "-"]

[[fields]]
source = ["MD5"]
target = "process.hash.md5"
omit_text = ["", "-"]

[[fields]]
source = ["SHA1"]
target = "process.hash.sha1"
omit_text = ["", "-"]

[[fields]]
source = ["SHA256"]
target = "process.hash.sha256"
omit_text = ["", "-"]

[[rules]]
categories = ["process"]
types = ["start"]
outcome = "success"
[[rules.when]]
path = ["ActionType"]
predicate = { op = "text", value = "ProcessCreated" }
