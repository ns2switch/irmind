interpreter = "irmind-mapping-tables-v2"
id = "mde-stream-devicefileevents"
version = "defender-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-defender"
parser_versions = ["defender-source-v1"]
format = "mde-stream"
format_version = "defender-source-v1"
native_type = "DeviceFileEvents"
action = ["properties", "ActionType"]

[partition]
host = ["properties", "DeviceId"]

[[fields]]
source = ["properties", "DeviceId"]
target = "host.id"
omit_text = ["", "-"]
observation = { kind = "host", role = "observer", scope = { kind = "host", path = ["properties", "DeviceId"] } }

[[fields]]
source = ["properties", "DeviceName"]
target = "host.name"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessAccountName"]
target = "user.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "actor", scope = { kind = "source_record" } }

[[fields]]
source = ["properties", "InitiatingProcessAccountDomain"]
target = "user.domain"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessId"]
target = "process.pid"
omit_text = ["", "-"]
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["properties", "InitiatingProcessFileName"]
target = "process.name"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessCommandLine"]
target = "process.command_line"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessParentId"]
target = "process.parent.pid"
omit_text = ["", "-"]
observation = { kind = "process", role = "parent", scope = { kind = "source_record" } }

[[fields]]
source = ["properties", "InitiatingProcessParentFileName"]
target = "process.parent.name"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "FileName"]
target = "file.name"
omit_text = ["", "-"]
observation = { kind = "file", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["properties", "FileSize"]
target = "file.size"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "MD5"]
target = "file.hash.md5"
omit_text = ["", "-"]
observation = { kind = "hash", role = "subject", scope = { kind = "global" } }

[[fields]]
source = ["properties", "SHA1"]
target = "file.hash.sha1"
omit_text = ["", "-"]
observation = { kind = "hash", role = "subject", scope = { kind = "global" } }

[[fields]]
source = ["properties", "SHA256"]
target = "file.hash.sha256"
omit_text = ["", "-"]
observation = { kind = "hash", role = "subject", scope = { kind = "global" } }

[[fields]]
source = ["properties", "InitiatingProcessMD5"]
target = "process.hash.md5"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessSHA1"]
target = "process.hash.sha1"
omit_text = ["", "-"]

[[fields]]
source = ["properties", "InitiatingProcessSHA256"]
target = "process.hash.sha256"
omit_text = ["", "-"]

[[rules]]
categories = ["file"]
types = ["creation"]
outcome = "unknown"
[[rules.when]]
path = ["properties", "ActionType"]
predicate = { op = "text", value = "FileCreated" }

[[rules]]
categories = ["file"]
types = ["change"]
outcome = "unknown"
[[rules.when]]
path = ["properties", "ActionType"]
predicate = { op = "text", value = "FileModified" }

[[rules]]
categories = ["file"]
types = ["deletion"]
outcome = "unknown"
[[rules.when]]
path = ["properties", "ActionType"]
predicate = { op = "text", value = "FileDeleted" }

[[rules]]
categories = ["file"]
types = ["change"]
outcome = "unknown"
[[rules.when]]
path = ["properties", "ActionType"]
predicate = { op = "text", value = "FileRenamed" }
