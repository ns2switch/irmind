interpreter = "irmind-mapping-tables-v2"
id = "network-outcome-zeek-json-conn"
version = "network-headers-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-zeek"
parser_versions = ["zeek-source-v1"]

[[rules]]
categories = ["network"]
types = ["connection"]
kind = "event"
outcome = "success"
[[rules.when]]
path = ["conn_state"]
predicate = { op = "text", value = "SF" }

[[rules]]
categories = ["network"]
types = ["connection"]
kind = "event"
outcome = "failure"
[[rules.when]]
path = ["conn_state"]
predicate = { op = "text", value = "REJ" }
