interpreter = "irmind-mapping-tables-v2"
id = "mapping-entra-signin-table-base"
version = "entra-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-entra"
parser_versions = ["entra-source-v1"]
format = "entra-signin-table"
format_version = "entra-source-v1"
action = ["OperationName"]

[partition]
account = ["AADTenantId"]

[[fields]]
source = ["AADTenantId"]
target = "cloud.account.id"
omit_text = [""]
observation = { kind = "account", role = "subject", scope = { kind = "account", path = ["AADTenantId"] } }
[[fields.when]]
path = ["AADTenantId"]
predicate = { op = "present" }

[[fields]]
source = ["UserPrincipalName"]
target = "user.name"
omit_text = [""]
observation = { kind = "user", role = "actor", scope = { kind = "account", path = ["AADTenantId"] } }
[[fields.when]]
path = ["AADTenantId"]
predicate = { op = "present" }

[[fields]]
source = ["UserId"]
target = "user.id"
omit_text = [""]
observation = { kind = "user", role = "actor", scope = { kind = "account", path = ["AADTenantId"] } }
[[fields.when]]
path = ["AADTenantId"]
predicate = { op = "present" }

[[fields]]
source = ["AppId"]
target = "irmind.resource.id"
omit_text = [""]
observation = { kind = "resource", role = "subject", scope = { kind = "account", path = ["AADTenantId"] } }
[[fields.when]]
path = ["AADTenantId"]
predicate = { op = "present" }

[[fields]]
source = ["IPAddress"]
target = "source.ip"
omit_text = [""]
conversion = "ip"
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[fields]]
source = ["UserAgent"]
target = "user_agent.original"
omit_text = [""]

[[fields]]
source = ["Id"]
target = "irmind.source_event.id"
omit_text = [""]
observation = { kind = "event", role = "subject", scope = { kind = "source_record" } }

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "unknown"
