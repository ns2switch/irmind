[package]
name = "irmind-mod-edr-crowdstrike"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
irmind-app = { path = "../../app", version = "0.1.0" }
irmind-domain = { path = "../../domain", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
secrecy = "0.10"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros"] }

[lints]
workspace = true

[dev-dependencies]
irmind-testkit = { path = "../../testkit", version = "0.1.0" }
