[package]
name = "irmind-mod-siem-chronicle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
irmind-app = { path = "../../app", version = "0.1.0" }
irmind-domain = { path = "../../domain", version = "0.1.0" }
irmind-http = { path = "../../http", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
zeroize = "1"
base64 = "0.22"
ring = "=0.17.14"
tokio = { version = "1", default-features = false, features = ["macros"] }

[dev-dependencies]
irmind-testkit = { path = "../../testkit", version = "0.1.0" }

[lints]
workspace = true
