[package]
name = "irmind-mod-siem-elastic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
irmind-app = { path = "../../app", version = "0.1.0" }
irmind-domain = { path = "../../domain", version = "0.1.0" }
irmind-http = { path = "../../http", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde_json = "1"
secrecy = "0.10"
tokio = { version = "1", default-features = false, features = ["macros"] }

[dev-dependencies]
irmind-infra = { path = "../../infra", version = "0.1.0" }
irmind-security = { path = "../../security", version = "0.1.0" }
irmind-mod-parser-json = { path = "../parser-json", version = "0.1.0" }
irmind-mod-mapping-ecs = { path = "../mapping-ecs", version = "0.1.0" }
ed25519-dalek = "2"
tempfile = "3"
irmind-testkit = { path = "../../testkit", version = "0.1.0" }

[lints]
workspace = true
