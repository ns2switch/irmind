interpreter = "irmind-mapping-tables-v2"
id = "mapping-windows-dns"
version = "windows-dns-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-windows-dns"
parser_versions = ["windows-dns-source-v1"]
format = "windows-dns-debug"
format_version = "windows-dns-source-v1"
action = ["opcode"]

[[fields]]
source = ["query_name"]
target = "dns.question.name"
omit_text = ["."]
observation = { kind = "domain", role = "subject", scope = { kind = "global" } }

[[fields]]
source = ["query_type"]
target = "dns.question.type"

[[fields]]
source = ["response_code"]
target = "dns.response_code"
[[fields.when]]
path = ["message"]
predicate = { op = "text", value = "R" }

[[fields]]
source = ["transport"]
target = "network.transport"

[[fields]]
source = ["remote_ip"]
target = "source.ip"
conversion = "ip"
observation = { kind = "ip", role = "source", scope = { kind = "global" } }
[[fields.when]]
path = ["direction"]
predicate = { op = "text", value = "Rcv" }

[[fields]]
source = ["remote_ip"]
target = "destination.ip"
conversion = "ip"
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }
[[fields.when]]
path = ["direction"]
predicate = { op = "text", value = "Snd" }

[[rules]]
categories = ["network"]
types = ["protocol"]
[[rules.when]]
path = ["message"]
predicate = { op = "text", value = "request" }

[[rules]]
categories = ["network"]
types = ["protocol"]
outcome = "success"
[[rules.when]]
path = ["message"]
predicate = { op = "text", value = "R" }
[[rules.when]]
path = ["response_code"]
predicate = { op = "text", value = "NOERROR" }

