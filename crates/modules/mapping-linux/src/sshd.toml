interpreter = "irmind-mapping-tables-v2"
id = "mapping-linux-sshd"
version = "linux-sshd-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-linux"
parser_versions = ["linux-source-v1"]
format = "linux"
format_version = "linux-source-v1"
dataset = "sshd"
action = ["syslog", "appname"]

[partition]
host = ["syslog", "hostname"]

[[fields]]
source = ["syslog", "hostname"]
target = "host.name"
observation = { kind = "host", role = "observer", scope = { kind = "host", path = ["syslog", "hostname"] } }

[[fields]]
source = ["syslog", "appname"]
target = "process.name"
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["syslog", "procid"]
target = "process.pid"
conversion = "decimal"
omit_text = ["", "-"]
observation = { kind = "process", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["sshd", "from"]
target = "source.ip"
conversion = "ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[fields]]
source = ["sshd", "port"]
target = "source.port"
conversion = "decimal"
omit_text = ["", "-"]

[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "success"
[[rules.when]]
path = ["sshd", "verb"]
predicate = { op = "text", value = "Accepted" }
[[rules.fields]]
source = ["sshd", "user"]
target = "user.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "actor", scope = { kind = "host", path = ["syslog", "hostname"] } }


[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "failure"
[[rules.when]]
path = ["sshd", "verb"]
predicate = { op = "text", value = "Failed" }
[[rules.fields]]
source = ["sshd", "user"]
target = "user.target.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "target", scope = { kind = "host", path = ["syslog", "hostname"] } }


[[rules]]
categories = ["authentication"]
types = ["start"]
outcome = "failure"
[[rules.when]]
path = ["sshd", "verb"]
predicate = { op = "text", value = "Invalid" }
[[rules.fields]]
source = ["sshd", "user"]
target = "user.target.name"
omit_text = ["", "-"]
observation = { kind = "user", role = "target", scope = { kind = "host", path = ["syslog", "hostname"] } }


