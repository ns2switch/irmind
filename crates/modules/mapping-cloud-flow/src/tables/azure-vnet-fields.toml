interpreter = "irmind-mapping-tables-v2"
id = "cloud-flow-azure-vnet-fields"
version = "cloud-flow-tables-v1"
target_schema = "irmind-common-event-v1"
source_contract = "irmind-source-record-v1"
parser = "parser-azure-flow"
parser_versions = ["azure-flow-source-v1"]
format = "azure-vnet-flow"
format_version = "azure-flow-source-v1"

action = ["columns", "flowState"]

[[rules]]
categories = ["network"]
types = ["connection"]
outcome = "unknown"

[[fields]]
source = ["columns", "sourceIP"]
target = "source.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "source", scope = { kind = "global" } }

[[fields]]
source = ["columns", "destinationIP"]
target = "destination.ip"
omit_text = ["", "-"]
observation = { kind = "ip", role = "destination", scope = { kind = "global" } }

[[fields]]
source = ["columns", "sourcePort"]
target = "source.port"
omit_text = ["", "-"]
conversion = "decimal"

[[fields]]
source = ["columns", "destinationPort"]
target = "destination.port"
omit_text = ["", "-"]
conversion = "decimal"

[[fields]]
source = ["record", "targetResourceID"]
target = "irmind.resource.id"
omit_text = ["", "-"]
observation = { kind = "resource", role = "subject", scope = { kind = "source_record" } }

[[fields]]
source = ["rule"]
target = "rule.name"
omit_text = ["", "-"]
observation = { kind = "rule", role = "subject", scope = { kind = "source_record" } }
