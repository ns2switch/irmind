[[variants]]
product = "windows"
service = "security"
parser_id = "parser-evtx"
parser_version = "evtx-source-v1"
mapping_id = "mapping-evtx-security-4625"
mapping_version = "evtx-security-4625-tables-v1"
channel = "Security"
events = [
  { path = ["Event", "System", "Channel"], equals = "Security" },
  { path = ["Event", "System", "EventID"], equals = "4625" },
]
fields = [
  { name = "EventID", path = ["Event", "System", "EventID"], value_type = "integer", conversion = "evtx_event_id", null_policy = "absent" },
  { name = "LogonType", path = ["Event", "EventData", "LogonType"], value_type = "integer", conversion = "evtx_logon_type", null_policy = "absent" },
]

