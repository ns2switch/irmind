[package]
name = "irmind-process-containment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["launcher"]
launcher = ["windows-sys/Win32_Security_Isolation", "windows-sys/Win32_System_Com", "windows-sys/Win32_System_SystemInformation", "windows-sys/Win32_System_JobObjects", "windows-sys/Win32_System_Pipes", "windows-sys/Win32_System_WindowsProgramming"]

[dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4", default-features = false }
seccompiler = { version = "0.5", default-features = false }
libc = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "process", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Console", "Win32_System_IO"] }

[lints]
workspace = true
