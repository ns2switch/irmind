[package]
name = "irmind-llm-chat-completions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
irmind-app = { path = "../app", version = "0.1.0" }
irmind-domain = { path = "../domain", version = "0.1.0" }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }
serde_json = "1"
secrecy = "0.10"
tokio = { version = "1", default-features = false, features = ["macros"] }
async-stream = "0.3"

[dev-dependencies]
irmind-testkit = { path = "../testkit", version = "0.1.0" }

[lints]
workspace = true
