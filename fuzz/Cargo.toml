[package]
name = "irmind-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
export = ["dep:irmind-infra"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
irmind-app = { path = "../crates/app", version = "0.1.0" }
irmind-domain = { path = "../crates/domain", version = "0.1.0" }
irmind-security = { path = "../crates/security", version = "0.1.0" }
irmind-mod-parser-json = { path = "../crates/modules/parser-json", version = "0.1.0" }
irmind-mod-parser-ecs = { path = "../crates/modules/parser-ecs", version = "0.1.0" }
irmind-mod-parser-ocsf = { path = "../crates/modules/parser-ocsf", version = "0.1.0" }
irmind-mod-parser-velociraptor = { path = "../crates/modules/parser-velociraptor", version = "0.1.0" }
irmind-mod-parser-hayabusa = { path = "../crates/modules/parser-hayabusa", version = "0.1.0" }
irmind-mod-parser-chainsaw = { path = "../crates/modules/parser-chainsaw", version = "0.1.0" }
irmind-mod-parser-plaso = { path = "../crates/modules/parser-plaso", version = "0.1.0" }
irmind-mod-parser-eztools = { path = "../crates/modules/parser-eztools", version = "0.1.0" }
irmind-mod-parser-zeek = { path = "../crates/modules/parser-zeek", version = "0.1.0" }
irmind-mod-parser-suricata = { path = "../crates/modules/parser-suricata", version = "0.1.0" }

irmind-infra = { path = "../crates/infra", version = "0.1.0", optional = true }
tempfile = "3"
serde_json = "1"

[[bin]]
name = "guard"
path = "fuzz_targets/guard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_ecs"
path = "fuzz_targets/parser_ecs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_ocsf"
path = "fuzz_targets/parser_ocsf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical"
path = "fuzz_targets/canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spl"
path = "fuzz_targets/spl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "export"
path = "fuzz_targets/export.rs"
test = false
doc = false
bench = false
required-features = ["export"]

[workspace]

[[bin]]
name = "parser_velociraptor"
path = "fuzz_targets/parser_velociraptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_hayabusa"
path = "fuzz_targets/parser_hayabusa.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_chainsaw"
path = "fuzz_targets/parser_chainsaw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_plaso"
path = "fuzz_targets/parser_plaso.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_eztools"
path = "fuzz_targets/parser_eztools.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_zeek"
path = "fuzz_targets/parser_zeek.rs"
test = false
