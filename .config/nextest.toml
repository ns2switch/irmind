[test-groups]
interactive-pty = { max-threads = 1 }
local-databases = { max-threads = 2 }
network-contracts = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(irmind-infra)'
test-group = 'local-databases'

[[profile.default.overrides]]
filter = 'package(irmind-mod-edr-crowdstrike) + package(irmind-mod-edr-sentinelone)'
test-group = 'network-contracts'

# PTY processes perform real keystore/custody work; keep independent terminal
# sessions from competing with one another while the rest of the suite runs.
[[profile.default.overrides]]
filter = 'package(irmind) and (binary(demo_pty) or binary(first_run_pty))'
test-group = 'interactive-pty'
