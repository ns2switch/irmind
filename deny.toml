[advisories]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "OpenSSL", "CC0-1.0", "CDLA-Permissive-2.0"]
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
