name: Reproducible release binaries
on:
  workflow_call:
    inputs:
      signing_rehearsal:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  observe_native_mapping_inputs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {destination: linux-x86_64, runner: ubuntu-22.04}
          - {destination: linux-aarch64, runner: ubuntu-24.04-arm}
          - {destination: macos-aarch64, runner: macos-26}
          - {destination: macos-x86_64, runner: macos-15-intel}
          - {destination: windows-x86_64, runner: windows-2025-vs2026}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DESTINATION: ${{ matrix.destination }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@766a42937d994bd78bb4591385445c188ccb3f09 # 1.97.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2, reviewed mold manifest
        if: matrix.destination == 'linux-x86_64'
        with: {tool: 'mold@2.42.1', checksum: true, fallback: none}
      - name: Observe production mapping compiler inputs
        if: runner.os != 'Windows'
        run: python3 .github/scripts/build_release_binaries.py "$DESTINATION" mapping-input --observe-only
      - name: Observe production mapping compiler inputs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OBSERVE_NATIVE_MAPPING_INPUTS: 'true'
        run: ./.github/scripts/build_release_windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mapping-input-${{ matrix.destination }}
          path: mapping-input/observation.json
          if-no-files-found: error

  prepare_native_mapping_inputs:
    needs: observe_native_mapping_inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: mapping-input-*, path: observations}
      - run: python3 -B .github/scripts/assemble_native_mapping_inputs.py observations NATIVE-MAPPING-INPUTS.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: native-mapping-build-inputs, path: NATIVE-MAPPING-INPUTS.json, if-no-files-found: error}

  verify_release_reproducibility:
    needs: prepare_native_mapping_inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - {destination: linux-x86_64, runner: ubuntu-22.04, artifact: irmind-linux}
          - {destination: linux-aarch64, runner: ubuntu-24.04-arm, artifact: irmind-linux-arm64}
          - {destination: macos-aarch64, runner: macos-26, artifact: irmind-macos-arm64}
          - {destination: macos-x86_64, runner: macos-15-intel, artifact: irmind-macos-x86_64}
          - {destination: windows-x86_64, runner: windows-2025-vs2026, artifact: irmind-windows}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@766a42937d994bd78bb4591385445c188ccb3f09 # 1.97.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2, reviewed mold manifest
        if: matrix.destination == 'linux-x86_64'
        with: {tool: 'mold@2.42.1', checksum: true, fallback: none}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: native-mapping-build-inputs, path: mapping-inputs}
      - name: Build and verify the two release executables and record their toolchain
        if: runner.os != 'Windows'
        env:
          DESTINATION: ${{ matrix.destination }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          python .github/scripts/build_release_binaries.py "$DESTINATION" dist --verify --mapping-inputs mapping-inputs/NATIVE-MAPPING-INPUTS.json
          python .github/scripts/release_build_environment.py record "$DESTINATION" "$RUNNER_LABEL" dist/BUILD-ENVIRONMENT.json
      - name: Build and verify the two Windows release executables and record their toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DESTINATION: ${{ matrix.destination }}
          RUNNER_LABEL: ${{ matrix.runner }}
          COMPARE_WINDOWS_MAPPINGS: ${{ inputs.signing_rehearsal }}
        run: ./.github/scripts/build_release_windows.ps1
      - name: Verify native ARM64 containment and inherited-file decoding
        if: matrix.destination == 'linux-aarch64'
        run: python .github/scripts/check_evtx_linux.py dist/irmind-evtx native-only
      - name: Measure the released Windows helper with 300 small distinct EVTX sources
        if: runner.os == 'Windows' && inputs.signing_rehearsal
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked --example collection
          cp dist/irmind-evtx.exe target/x86_64-pc-windows-msvc/release/
          target/x86_64-pc-windows-msvc/release/examples/collection.exe > evtx-collection.json
          cat evtx-collection.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows' && inputs.signing_rehearsal
        with: {name: evtx-windows-collection, path: evtx-collection.json, if-no-files-found: error}
      - name: Complete the unsigned distribution package
        run: |
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 dist/
          cd dist
          names=(irmind irmind-evtx)
          if [[ "$RUNNER_OS" == Windows ]]; then names=(irmind.exe irmind-evtx.exe); fi
          hash=(sha256sum)
          if [[ "$RUNNER_OS" == macOS ]]; then hash=(shasum -a 256); fi
          "${hash[@]}" "${names[@]}" LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 BUILD-ENVIRONMENT.json > SHA256SUMS
          "${hash[@]}" -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "${{ matrix.artifact }}", path: dist/, if-no-files-found: error}

  create_sigma_report_case:
    needs: verify_release_reproducibility
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@766a42937d994bd78bb4591385445c188ccb3f09 # 1.97.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-linux, path: release-binary}
      - name: Create and check a signed Sigma case with the Linux release executable
        env:
          IRMIND_RELEASE_BINARY: ${{ github.workspace }}/release-binary/irmind
          IRMIND_RELEASE_SIGMA_OUTPUT: ${{ github.workspace }}/portable-sigma
          CARGO_INCREMENTAL: 0
        run: |
          (cd release-binary && sha256sum --check SHA256SUMS)
          chmod +x "$IRMIND_RELEASE_BINARY"
          "$IRMIND_RELEASE_BINARY" --version
          cargo test -p irmind --no-default-features --features keystore-file --profile ci --locked --test release_sigma_report -- --ignored
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: release-sigma-report-v10, path: portable-sigma/, if-no-files-found: error}

  verify_sigma_report_case:
    needs: [verify_release_reproducibility, create_sigma_report_case]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-26, binary: irmind, artifact: irmind-macos-arm64}
          - {runner: macos-15-intel, binary: irmind, artifact: irmind-macos-x86_64}
          - {runner: windows-2025-vs2026, binary: irmind.exe, artifact: irmind-windows}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: '${{ matrix.artifact }}', path: release-binary}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: release-sigma-report-v10, path: portable-sigma}
      - name: Verify the Linux export with this platform's release executable
        shell: bash
        env:
          RELEASE_EXECUTABLE: release-binary/${{ matrix.binary }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            (cd release-binary && shasum -a 256 -c SHA256SUMS)
            chmod +x "$RELEASE_EXECUTABLE"
          else
            (cd release-binary && sha256sum --check SHA256SUMS)
          fi
          "$RELEASE_EXECUTABLE" --version
          python -B .github/scripts/verify_release_sigma_report.py "$RELEASE_EXECUTABLE" portable-sigma
