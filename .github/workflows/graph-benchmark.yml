name: Synthetic graph benchmark
on:
  workflow_dispatch:
    inputs:
      worker_sweep:
        description: Measure adaptive workers and the fixed-worker reference on one Linux runner
        type: boolean
        default: false
      worker_workload:
        description: Corpus for the worker sweep
        type: choice
        default: cloud-files
        options: [cloud-files, endpoint-files, ndjson-1gib, ndjson-4gib]
      pipeline_profile:
        description: Profile the production pipeline and allocation calls against a pinned baseline
        type: boolean
        default: false
      profile_source:
        description: Production profile source
        type: choice
        default: all
        options: [all, ocsf]
      profile_base:
        description: Profiling-only baseline commit for the production pipeline
        type: string
        default: ""
      evtx_source:
        description: Paired EVTX and ECS release smokes with shared pipeline counters (three 1 GiB repetitions)
        type: boolean
        default: false
      compare_base:
        description: Optional 40-character baseline commit for paired release measurements
        type: string
        default: ""
      common_schema:
        description: Compare the source decoder and mapping pipeline with the pinned baseline
        type: boolean
        default: false
      mapped_candidate:
        description: Enable mapped V3 for the candidate; false checks unchanged default V2
        type: boolean
        default: true
      direct_write:
        description: Compare V2 reference, preceding mapped V3 and direct V3 in the same runner
        type: boolean
        default: false
      scenario:
        description: Release benchmark workload
        type: choice
        default: all
        options:
          - all
          - cloud-v1
          - cloud-v2
          - endpoint-v1-1
          - endpoint-v1-64
          - endpoint-v1-1024
          - endpoint-v1-1025
          - endpoint-v2-1
          - endpoint-v2-64
          - endpoint-v2-1024
          - endpoint-v2-1025
  schedule:
    - cron: '31 4 * * 1'
permissions:
  contents: read
concurrency:
  group: graph-benchmark-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  HUNTEVAL_COMMIT: 4cbb555a56bc17cb03b988ad2f15b1374eecf183
jobs:
  graph_benchmark:
    if: ${{ !inputs.worker_sweep && !inputs.pipeline_profile && !inputs.evtx_source && !inputs.compare_base && !inputs.common_schema }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {key: graph-benchmark-linux}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - name: Fetch and verify pinned HuntEval public sources and private answers
        shell: bash
        run: |
          set -euo pipefail
          dataset_root=$(mktemp -d "$RUNNER_TEMP/hunteval.XXXXXXXX")
          trap 'rm -rf "$dataset_root"' ERR
          git -C "$dataset_root" init -q
          git -C "$dataset_root" remote add origin https://github.com/ns2switch/HuntEval.git
          git -C "$dataset_root" fetch -q --depth 1 origin "$HUNTEVAL_COMMIT"
          git -C "$dataset_root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dataset_root" rev-parse HEAD)" = "$HUNTEVAL_COMMIT"
          (cd "$dataset_root" && sha256sum -c "$GITHUB_WORKSPACE/scripts/hunteval.sha256")
          echo "IRMIND_HUNTEVAL_ROOT=$dataset_root" >> "$GITHUB_ENV"
      - name: Evaluate all 18 HuntEval episodes without a model
        shell: bash
        run: |
          set -o pipefail
          cargo test -p irmind-infra hunteval_reference_corpus --release --locked -- --ignored --nocapture --test-threads 1 2>&1 | tee benchmark-results.txt
      - name: Compare V1 and V2 CloudTrail and endpoint Parquet in release mode
        shell: bash
        env:
          BENCH_SCENARIO: ${{ inputs.scenario || 'all' }}
        run: |
          set -euo pipefail
          failed=0
          for version in v1 v2; do
            export IRMIND_BENCH_SCENARIO="cloud-$version"
            if [[ "$BENCH_SCENARIO" == all || "$BENCH_SCENARIO" == "$IRMIND_BENCH_SCENARIO" ]]; then
              if ! cargo test -p irmind-infra parquet_benchmark_ --release --locked -- --ignored --nocapture --test-threads 1 --skip parquet_benchmark_50mb 2>&1 | tee -a benchmark-results.txt; then
                failed=1
              fi
            fi
            for hosts in 1 64 1024 1025; do
              export IRMIND_BENCH_SCENARIO="endpoint-$version-$hosts"
              if [[ "$BENCH_SCENARIO" == all || "$BENCH_SCENARIO" == "$IRMIND_BENCH_SCENARIO" ]]; then
                if ! cargo test -p irmind-infra parquet_benchmark_15gb --release --locked -- --ignored --nocapture --test-threads 1 2>&1 | tee -a benchmark-results.txt; then
                  failed=1
                fi
              fi
            done
          done
          exit "$failed"
      - name: Measure warm build and binary size
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          started=$(date +%s)
          cargo test -p irmind-infra --release --locked --no-run 2>&1 | tee -a benchmark-results.txt
          echo "BUILD_HOT_SECONDS=$(($(date +%s) - started))" | tee -a benchmark-results.txt
          started=$(date +%s)
          cargo build -p irmind --release --locked 2>&1 | tee -a benchmark-results.txt
          echo "BINARY_BUILD_SECONDS=$(($(date +%s) - started))" | tee -a benchmark-results.txt
          stat -c 'BINARY_BYTES=%s' target/release/irmind | tee -a benchmark-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: graph-benchmark-results
          path: benchmark-results.txt
          if-no-files-found: warn
      - name: Remove downloaded HuntEval files
        if: always()
        shell: bash
        run: |
          if [[ -n "${IRMIND_HUNTEVAL_ROOT:-}" && "$IRMIND_HUNTEVAL_ROOT" == "$RUNNER_TEMP"/hunteval.* ]]; then
            rm -rf -- "$IRMIND_HUNTEVAL_ROOT"
          fi

  paired_v2:
    if: ${{ !inputs.worker_sweep && !inputs.pipeline_profile && !inputs.evtx_source && inputs.compare_base != '' && !inputs.common_schema }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [cloud-v2, endpoint-v2-1, endpoint-v2-64, endpoint-v2-1024, endpoint-v2-1025, endpoint-v2-1-chronological, endpoint-v2-64-chronological, endpoint-v2-1024-chronological, endpoint-v2-1025-chronological, cloud-v1, endpoint-v1-1, endpoint-v1-64, endpoint-v1-1024, endpoint-v1-1025, endpoint-v1-1-chronological, endpoint-v1-64-chronological, endpoint-v1-1024-chronological, endpoint-v1-1025-chronological]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: graph-benchmark-linux
          save-if: ${{ github.ref_name == 'main' }}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - name: Fetch and verify pinned HuntEval public sources and private answers
        shell: bash
        run: |
          set -euo pipefail
          dataset_root=$(mktemp -d "$RUNNER_TEMP/hunteval.XXXXXXXX")
          trap 'rm -rf "$dataset_root"' ERR
          git -C "$dataset_root" init -q
          git -C "$dataset_root" remote add origin https://github.com/ns2switch/HuntEval.git
          git -C "$dataset_root" fetch -q --depth 1 origin "$HUNTEVAL_COMMIT"
          git -C "$dataset_root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dataset_root" rev-parse HEAD)" = "$HUNTEVAL_COMMIT"
          (cd "$dataset_root" && sha256sum -c "$GITHUB_WORKSPACE/scripts/hunteval.sha256")
          echo "IRMIND_HUNTEVAL_ROOT=$dataset_root" >> "$GITHUB_ENV"
      - name: Compare the baseline and candidate in the same runner
        shell: bash
        env:
          BASE_REF: ${{ inputs.compare_base }}
          IRMIND_BENCH_SCENARIO: ${{ matrix.scenario }}
        run: bash .github/scripts/benchmark_parquet_pair.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: parquet-pair-${{ matrix.scenario }}
          path: benchmark-pair-*.txt
          if-no-files-found: warn
      - name: Remove downloaded HuntEval files
        if: always()
        shell: bash
        run: |
          if [[ -n "${IRMIND_HUNTEVAL_ROOT:-}" && "$IRMIND_HUNTEVAL_ROOT" == "$RUNNER_TEMP"/hunteval.* ]]; then
            rm -rf -- "$IRMIND_HUNTEVAL_ROOT"
          fi

  common_schema:
    if: ${{ !inputs.worker_sweep && !inputs.pipeline_profile && !inputs.evtx_source && inputs.common_schema && inputs.compare_base != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [cloud-v2, endpoint-v2-1, endpoint-v2-64, endpoint-v2-1024, endpoint-v2-1025, endpoint-v2-1-chronological, endpoint-v2-64-chronological, endpoint-v2-1024-chronological, endpoint-v2-1025-chronological]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: common-schema-benchmark-linux
          save-if: ${{ github.ref_name == 'main' }}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - name: Fetch and verify pinned HuntEval public sources and private answers
        shell: bash
        run: |
          set -euo pipefail
          dataset_root=$(mktemp -d "$RUNNER_TEMP/hunteval.XXXXXXXX")
          trap 'rm -rf "$dataset_root"' ERR
          git -C "$dataset_root" init -q
          git -C "$dataset_root" remote add origin https://github.com/ns2switch/HuntEval.git
          git -C "$dataset_root" fetch -q --depth 1 origin "$HUNTEVAL_COMMIT"
          git -C "$dataset_root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dataset_root" rev-parse HEAD)" = "$HUNTEVAL_COMMIT"
          (cd "$dataset_root" && sha256sum -c "$GITHUB_WORKSPACE/scripts/hunteval.sha256")
          echo "IRMIND_HUNTEVAL_ROOT=$dataset_root" >> "$GITHUB_ENV"
      - name: Compare release schemas on the same runner
        env:
          DIRECT_WRITE: ${{ inputs.direct_write }}
          MAPPED_CANDIDATE: ${{ inputs.mapped_candidate }}
          BASE_REF: ${{ inputs.compare_base }}
          IRMIND_BENCH_SCENARIO: ${{ matrix.scenario }}
        run: bash .github/scripts/benchmark_common_schema.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: common-schema-${{ matrix.scenario }}
          path: common-schema-*.txt
          if-no-files-found: warn
      - name: Remove downloaded HuntEval files
        if: always()
        shell: bash
        run: |
          if [[ -n "${IRMIND_HUNTEVAL_ROOT:-}" && "$IRMIND_HUNTEVAL_ROOT" == "$RUNNER_TEMP"/hunteval.* ]]; then
            rm -rf -- "$IRMIND_HUNTEVAL_ROOT"
          fi

  evtx_source:
    if: ${{ !inputs.worker_sweep && inputs.evtx_source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: evtx-mapping-smoke-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - name: Build the separately resolved isolated helper in release mode
        run: cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked
      - name: Generate synthetic EVTX and compare both writers in the same runner
        shell: bash
        run: |
          set -euo pipefail
          export IRMIND_EVTX_SOURCE_BENCH_INPUT="$RUNNER_TEMP/synthetic-mapping.evtx"
          trap 'rm -f "$IRMIND_EVTX_SOURCE_BENCH_INPUT"' EXIT
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/generate_evtx_mapping_benchmark.py "$IRMIND_EVTX_SOURCE_BENCH_INPUT"
          sh scripts/benchmark_evtx_source.sh 2>&1 | tee evtx-source-benchmark.txt
          sh scripts/benchmark_ecs_source.sh 2>&1 | tee ecs-source-benchmark.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evtx-source-smoke
          path: '*-source-benchmark.txt'
          if-no-files-found: error

  source_pipeline_profile:
    if: ${{ !inputs.worker_sweep && inputs.pipeline_profile }}
    uses: ./.github/workflows/source-pipeline-profile.yml
    with:
      baseline: ${{ inputs.profile_base }}
      source: ${{ inputs.profile_source || 'all' }}


  worker_sweep:
    if: ${{ inputs.worker_sweep }}
    runs-on: ${{ inputs.worker_workload == 'ndjson-4gib' && 'windows-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: worker-sweep-${{ runner.os }}
          save-if: ${{ github.ref_name == 'main' }}
      - name: Configure the Linux linker and RSS measurement
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y mold time
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"
      - name: Compare fixed and adaptive workers
        shell: bash
        env:
          BASE_REF: ${{ inputs.compare_base }}
          WORKER_WORKLOAD: ${{ inputs.worker_workload }}
        run: bash .github/scripts/benchmark_workers.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: worker-sweep
          path: worker-sweep-*.txt
          if-no-files-found: warn
