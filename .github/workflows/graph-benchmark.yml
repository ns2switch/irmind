name: Synthetic graph benchmark
on:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'
permissions:
  contents: read
concurrency:
  group: graph-benchmark-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  HUNTEVAL_COMMIT: 4cbb555a56bc17cb03b988ad2f15b1374eecf183
jobs:
  graph_benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {key: graph-benchmark-linux}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - name: Fetch and verify pinned HuntEval public sources and private answers
        shell: bash
        run: |
          set -euo pipefail
          dataset_root=$(mktemp -d "$RUNNER_TEMP/hunteval.XXXXXXXX")
          trap 'rm -rf "$dataset_root"' ERR
          git -C "$dataset_root" init -q
          git -C "$dataset_root" remote add origin https://github.com/ns2switch/HuntEval.git
          git -C "$dataset_root" fetch -q --depth 1 origin "$HUNTEVAL_COMMIT"
          git -C "$dataset_root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dataset_root" rev-parse HEAD)" = "$HUNTEVAL_COMMIT"
          (cd "$dataset_root" && sha256sum -c "$GITHUB_WORKSPACE/scripts/hunteval.sha256")
          echo "IRMIND_HUNTEVAL_ROOT=$dataset_root" >> "$GITHUB_ENV"
      - name: Evaluate all 18 HuntEval episodes without a model
        shell: bash
        run: |
          set -o pipefail
          cargo test -p irmind-infra hunteval_reference_corpus --release --locked -- --ignored --nocapture --test-threads 1 2>&1 | tee benchmark-results.txt
      - name: Profile Parquet conversion and HuntEval needles in 1 GB and 15 GB
        shell: bash
        run: |
          set -o pipefail
          cargo test -p irmind-infra parquet_benchmark_ --release --locked -- --ignored --nocapture --test-threads 1 --skip parquet_benchmark_50mb 2>&1 | tee -a benchmark-results.txt
      - name: Measure warm build and binary size
        shell: bash
        run: |
          set -o pipefail
          started=$(date +%s)
          cargo test -p irmind-infra --release --locked --no-run 2>&1 | tee -a benchmark-results.txt
          echo "BUILD_HOT_SECONDS=$(($(date +%s) - started))" | tee -a benchmark-results.txt
          started=$(date +%s)
          cargo build -p irmind --release --locked 2>&1 | tee -a benchmark-results.txt
          echo "BINARY_BUILD_SECONDS=$(($(date +%s) - started))" | tee -a benchmark-results.txt
          stat -c 'BINARY_BYTES=%s' target/release/irmind | tee -a benchmark-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: graph-benchmark-results
          path: benchmark-results.txt
          if-no-files-found: warn
      - name: Remove downloaded HuntEval files
        if: always()
        shell: bash
        run: |
          if [[ -n "${IRMIND_HUNTEVAL_ROOT:-}" && "$IRMIND_HUNTEVAL_ROOT" == "$RUNNER_TEMP"/hunteval.* ]]; then
            rm -rf -- "$IRMIND_HUNTEVAL_ROOT"
          fi
