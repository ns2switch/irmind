name: Synthetic graph benchmark
on:
  workflow_dispatch:
    inputs:
      include_legacy:
        description: Include the slow legacy DuckDB graph baseline
        type: boolean
        default: false
  schedule:
    - cron: '31 4 * * 1'
permissions:
  contents: read
concurrency:
  group: graph-benchmark-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
jobs:
  graph_benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {key: graph-benchmark-linux}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - name: Profile representative and large-record 1 GB corpora
        if: github.event_name == 'schedule' || inputs.include_legacy == true
        shell: bash
        run: |
          set -o pipefail
          cargo test -p irmind-infra graph_benchmark_ --profile ci --locked -- --ignored --nocapture --test-threads 1 2>&1 | tee benchmark-results.txt
      - name: Profile Parquet conversion with 1 GB and 15 GB synthetic corpora
        shell: bash
        run: |
          set -o pipefail
          cargo test -p irmind-infra parquet_benchmark_ --release --locked -- --ignored --nocapture --test-threads 1 2>&1 | tee -a benchmark-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: graph-benchmark-results
          path: benchmark-results.txt
          if-no-files-found: warn
