name: Synthetic graph benchmark
on:
  workflow_dispatch:
    inputs:
      evtx_sweep:
        description: Measure a single 1 GiB EVTX source at one, four and all workers
        type: boolean
        default: false
      worker_sweep:
        description: Compare current mapped writer worker settings on one runner
        type: boolean
        default: false
      worker_workload:
        description: Corpus for the worker sweep
        type: choice
        default: cloud-files
        options: [cloud-files, endpoint-files, endpoint-disorder, ndjson-1gib, ndjson-4gib]
      compare_base:
        description: Full reference commit for the paired worker sweep
        type: string
        default: ""
  schedule:
    - cron: '31 4 * * 1'
permissions:
  contents: read
concurrency:
  group: graph-benchmark-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  HUNTEVAL_COMMIT: 4cbb555a56bc17cb03b988ad2f15b1374eecf183
jobs:
  worker_sweep:
    if: ${{ inputs.worker_sweep && !inputs.evtx_sweep }}
    runs-on: ${{ inputs.worker_workload == 'ndjson-4gib' && 'windows-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: worker-sweep-${{ runner.os }}
          save-if: ${{ github.ref_name == 'main' }}
      - name: Configure the Linux linker and RSS measurement
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y mold time
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"
      - name: Compare fixed and adaptive workers
        shell: bash
        env:
          BASE_REF: ${{ inputs.compare_base }}
          WORKER_WORKLOAD: ${{ inputs.worker_workload }}
        run: bash .github/scripts/benchmark_workers.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: worker-sweep
          path: worker-sweep-*.txt
          if-no-files-found: warn

  evtx_sweep:
    if: ${{ inputs.evtx_sweep }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: evtx-parallel-release-${{ runner.os }}
          save-if: ${{ github.ref_name == 'main' }}
      - name: Build the release helper and current signed-ingestion benchmark
        shell: bash
        run: cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked --bin irmind-evtx --example large_collection
      - name: Measure identical 1 GiB sources with one, four, all and automatic workers
        shell: bash
        run: |
          set -euo pipefail
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          python3 -B scripts/benchmark_evtx_large.py "helpers/evtx/target/release/examples/large_collection$suffix" --worker-sweep --output evtx-worker-sweep.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evtx-workers-${{ runner.os }}
          path: evtx-worker-sweep.json
          if-no-files-found: error

  current_v3:
    if: ${{ !inputs.worker_sweep && !inputs.evtx_sweep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [cloud, endpoint-1, endpoint-64, endpoint-1024, endpoint-1025, endpoint-1-chronological, endpoint-64-chronological, endpoint-1024-chronological, endpoint-1025-chronological]
    env:
      IRMIND_BENCH_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: common-schema-benchmark-linux
          save-if: ${{ github.ref_name == 'main' }}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - name: Fetch and verify pinned HuntEval public sources and private answers
        shell: bash
        run: |
          set -euo pipefail
          dataset_root=$(mktemp -d "$RUNNER_TEMP/hunteval.XXXXXXXX")
          trap 'rm -rf "$dataset_root"' ERR
          git -C "$dataset_root" init -q
          git -C "$dataset_root" remote add origin https://github.com/ns2switch/HuntEval.git
          git -C "$dataset_root" fetch -q --depth 1 origin "$HUNTEVAL_COMMIT"
          git -C "$dataset_root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dataset_root" rev-parse HEAD)" = "$HUNTEVAL_COMMIT"
          (cd "$dataset_root" && sha256sum -c "$GITHUB_WORKSPACE/scripts/hunteval.sha256")
          echo "IRMIND_HUNTEVAL_ROOT=$dataset_root" >> "$GITHUB_ENV"
      - name: Measure the current release pipeline
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p irmind-infra parquet_benchmark_15gb --release --locked -- --ignored --nocapture --test-threads 1 2>&1 | tee current-v3.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: current-v3-${{ matrix.scenario }}
          path: current-v3.txt
          if-no-files-found: error
      - name: Remove downloaded HuntEval files
        if: always()
        shell: bash
        run: |
          if [[ -n "${IRMIND_HUNTEVAL_ROOT:-}" && "$IRMIND_HUNTEVAL_ROOT" == "$RUNNER_TEMP"/hunteval.* ]]; then
            rm -rf -- "$IRMIND_HUNTEVAL_ROOT"
          fi

  hunt_eval:
    if: ${{ !inputs.worker_sweep && !inputs.evtx_sweep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IRMIND_BENCH_SCENARIO: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: common-schema-benchmark-linux
          save-if: ${{ github.ref_name == 'main' }}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - name: Fetch and verify pinned HuntEval public sources and private answers
        shell: bash
        run: |
          set -euo pipefail
          dataset_root=$(mktemp -d "$RUNNER_TEMP/hunteval.XXXXXXXX")
          trap 'rm -rf "$dataset_root"' ERR
          git -C "$dataset_root" init -q
          git -C "$dataset_root" remote add origin https://github.com/ns2switch/HuntEval.git
          git -C "$dataset_root" fetch -q --depth 1 origin "$HUNTEVAL_COMMIT"
          git -C "$dataset_root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dataset_root" rev-parse HEAD)" = "$HUNTEVAL_COMMIT"
          (cd "$dataset_root" && sha256sum -c "$GITHUB_WORKSPACE/scripts/hunteval.sha256")
          echo "IRMIND_HUNTEVAL_ROOT=$dataset_root" >> "$GITHUB_ENV"

      - name: Evaluate HuntEval without a model
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p irmind-infra hunteval_reference_corpus --release --locked -- --ignored --nocapture --test-threads 1 2>&1 | tee hunteval.txt
          cargo test -p irmind-infra parquet_benchmark_1gb --release --locked -- --ignored --nocapture --test-threads 1 2>&1 | tee -a hunteval.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hunteval-synthetic-results
          path: hunteval.txt
          if-no-files-found: error
      - name: Remove downloaded HuntEval files
        if: always()
        shell: bash
        run: |
          if [[ -n "${IRMIND_HUNTEVAL_ROOT:-}" && "$IRMIND_HUNTEVAL_ROOT" == "$RUNNER_TEMP"/hunteval.* ]]; then
            rm -rf -- "$IRMIND_HUNTEVAL_ROOT"
          fi

  absolute_targets:
    needs: current_v3
    if: ${{ !cancelled() && !inputs.worker_sweep && !inputs.evtx_sweep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: current-v3-*
          path: graph-measurements
      - name: Verify complete release measurements and absolute targets
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/collect_graph_metrics.py graph-measurements metrics.json --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --commit "$GITHUB_SHA"
          python3 -B .github/scripts/evaluate_v3_gates.py metrics.json | tee absolute-targets.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: current-graph-metrics
          path: |
            metrics.json
            absolute-targets.json
          if-no-files-found: error
