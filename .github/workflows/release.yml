name: Release installation and distribution
on:
  workflow_call:
    inputs:
      profile_benchmark:
        type: boolean
        default: false
permissions:
  contents: read
  attestations: read
jobs:
  verify_install_linux:
    if: ${{ !cancelled() && !inputs.profile_benchmark && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Install and run the verified Linux release in a clean runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e "$HOME/.local/bin/irmind"
          test ! -e "$HOME/.local/bin/irmind-evtx"
          trap 'rm -f "$HOME/.local/bin/irmind" "$HOME/.local/bin/irmind-evtx"' EXIT
          sh install.sh "$GITHUB_REF_NAME"
          test -x "$HOME/.local/bin/irmind-evtx"
          "$HOME/.local/bin/irmind" --version
  verify_install_macos:
    if: ${{ !cancelled() && !inputs.profile_benchmark && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Install and run the verified macOS release in a clean runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e "$HOME/.local/bin/irmind"
          test ! -e "$HOME/.local/bin/irmind-evtx"
          trap 'rm -f "$HOME/.local/bin/irmind" "$HOME/.local/bin/irmind-evtx"' EXIT
          sh install.sh "$GITHUB_REF_NAME"
          test -x "$HOME/.local/bin/irmind-evtx"
          "$HOME/.local/bin/irmind" --version
  verify_install_windows:
    if: ${{ !cancelled() && !inputs.profile_benchmark && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Install and run the verified Windows release in a clean runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $binary = Join-Path $env:LOCALAPPDATA 'IRMind\bin\irmind.exe'
          $helper = Join-Path $env:LOCALAPPDATA 'IRMind\bin\irmind-evtx.exe'
          if (Test-Path -LiteralPath $helper) { throw 'helper installer target is not clean' }
          if (Test-Path -LiteralPath $binary) { throw 'installer target is not clean' }
          try {
            ./install.ps1 -Version $env:GITHUB_REF_NAME
            if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'verified helper is missing' }
            & $binary --version
            if ($LASTEXITCODE -ne 0) { throw 'verified binary did not start' }
          } finally {
            Remove-Item -LiteralPath $binary,$helper -Force -ErrorAction SilentlyContinue
          }

  benchmark_profiles:
    if: ${{ inputs.profile_benchmark && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with: {tool: 'mold@2.42.1', checksum: true, fallback: none}
      - name: Compare release builds and signed-format goldens
        run: bash .github/scripts/benchmark_release_profile.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-profile-comparison
          path: |
            release-profile-*.txt
            release-profile-*.json
          if-no-files-found: error
