name: Release installation and distribution
on:
  workflow_call:
    inputs:
      profile_benchmark:
        type: boolean
        default: false
      profile_reproducibility:
        type: boolean
        default: false
      signing_rehearsal:
        type: boolean
        default: false
permissions:
  contents: read
  attestations: read
jobs:
  verify_install_linux:
    if: ${{ !cancelled() && !inputs.profile_benchmark && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Install and run the verified Linux release in a clean runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e "$HOME/.local/bin/irmind"
          test ! -e "$HOME/.local/bin/irmind-evtx"
          trap 'rm -f "$HOME/.local/bin/irmind" "$HOME/.local/bin/irmind-evtx"' EXIT
          sh install.sh "$GITHUB_REF_NAME"
          test -x "$HOME/.local/bin/irmind-evtx"
          "$HOME/.local/bin/irmind" --version
  verify_install_macos:
    if: ${{ !cancelled() && !inputs.profile_benchmark && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Install and run the verified macOS release in a clean runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e "$HOME/.local/bin/irmind"
          test ! -e "$HOME/.local/bin/irmind-evtx"
          trap 'rm -f "$HOME/.local/bin/irmind" "$HOME/.local/bin/irmind-evtx"' EXIT
          sh install.sh "$GITHUB_REF_NAME"
          test -x "$HOME/.local/bin/irmind-evtx"
          "$HOME/.local/bin/irmind" --version
  verify_install_windows:
    if: ${{ !cancelled() && !inputs.profile_benchmark && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Install and run the verified Windows release in a clean runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $binary = Join-Path $env:LOCALAPPDATA 'IRMind\bin\irmind.exe'
          $helper = Join-Path $env:LOCALAPPDATA 'IRMind\bin\irmind-evtx.exe'
          if (Test-Path -LiteralPath $helper) { throw 'helper installer target is not clean' }
          if (Test-Path -LiteralPath $binary) { throw 'installer target is not clean' }
          try {
            ./install.ps1 -Version $env:GITHUB_REF_NAME
            if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'verified helper is missing' }
            & $binary --version
            if ($LASTEXITCODE -ne 0) { throw 'verified binary did not start' }
          } finally {
            Remove-Item -LiteralPath $binary,$helper -Force -ErrorAction SilentlyContinue
          }

  rehearse_install_windows:
    if: ${{ inputs.signing_rehearsal && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: signed-release-dry-run, path: signed-assets}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Verify provenance and rehearse installation of the exact signed Windows binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/rehearse_windows_install.py signed-assets

  benchmark_profiles:
    if: ${{ inputs.profile_benchmark && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with: {tool: 'mold@2.42.1', checksum: true, fallback: none}
      - name: Compare release builds and signed-format goldens
        run: bash .github/scripts/benchmark_release_profile.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-profile-comparison
          path: |
            release-profile-*.txt
            release-profile-*.json
          if-no-files-found: error

  reproduce_profiles:
    if: ${{ inputs.profile_reproducibility && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    strategy:
      fail-fast: false
      matrix:
        profile: [default, thin]
        platform: [linux-x86_64, linux-arm64, macos-arm64, macos-x86_64, windows-x86_64]
        include:
          - {platform: linux-x86_64, runner: ubuntu-22.04, rustflags: '-C link-arg=-fuse-ld=mold'}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm}
          - {platform: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin}
          - {platform: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin}
          - {platform: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2, reviewed mold manifest
        if: matrix.platform == 'linux-x86_64'
        with: {tool: 'mold@2.42.1', checksum: true, fallback: none}
      - name: Build twice from clean, differently named checkouts
        run: python .github/scripts/reproduce_release_profile.py --platform "${{ matrix.platform }}" --profile "${{ matrix.profile }}" --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-repro-${{ matrix.platform }}-${{ matrix.profile }}
          path: release-repro-*.json
          if-no-files-found: error

  compare_reproduced_profiles:
    if: ${{ inputs.profile_reproducibility && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    needs: [reproduce_profiles]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: 'release-repro-*', path: repro, merge-multiple: true}
      - run: python3 .github/scripts/reproduce_release_profile.py --compare repro
