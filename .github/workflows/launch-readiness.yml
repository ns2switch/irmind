name: Clean release first impression
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact signed release tag to install and exercise
        required: true
        default: v0.5.5
        type: string
permissions:
  contents: read
  attestations: read
jobs:
  first_impression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          save-if: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: 'cargo-nextest', fallback: none}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Verify and install the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: python3 .github/scripts/audit_release_install.py --tag "$RELEASE_TAG"
      - name: Exercise installed binary at 80x24 and 100x40 plus slash-command exploration
        shell: bash
        run: cargo nextest run -p irmind --test demo_pty --all-features --cargo-profile ci --locked -E 'test(eighty_by_twenty_four) + test(hundred_by_forty) + test(release_exploration)'
