name: Weekly fuzzing
on:
  schedule:
    - cron: '41 2 * * 0'
    - cron: '47 4 * * 1-6'
  workflow_dispatch:
    inputs:
      native_windows:
        description: Run only the native Windows EVTX diagnostic suite
        type: boolean
        default: false
      linux_compatibility:
        description: Check the Ubuntu 22.04 baseline helper and pinned container probes
        type: boolean
        default: false
      static_crt:
        description: Compare a static-CRT decoder with the normal broker harness
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    if: ${{ inputs.native_windows != true && inputs.linux_compatibility != true && (github.event_name != 'schedule' || github.event.schedule == '41 2 * * 0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {key: weekly-fuzz}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: 'cargo-deny', fallback: none}
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check --hide-inclusion-graph
      - name: Install verified upstream cargo-fuzz binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tools
          gh release download 0.13.2 -R rust-fuzz/cargo-fuzz -p cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz -O .tools/cargo-fuzz.tar.gz
          printf '%s  %s\n' b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c .tools/cargo-fuzz.tar.gz | sha256sum --check
          tar -xzf .tools/cargo-fuzz.tar.gz -C .tools
          install -m 0755 .tools/cargo-fuzz "$HOME/.cargo/bin/cargo-fuzz"
      - name: Copy versioned seeds to temporary corpora
        run: |
          for target in guard parsers parser_syslog parser_linux parser_ecs parser_ocsf parser_velociraptor parser_hayabusa parser_chainsaw parser_plaso parser_eztools parser_declarative canonical spl export; do
            mkdir -p "fuzz/corpus/$target"
            cp "fuzz/seeds/$target/"* "fuzz/corpus/$target/"
          done
      - name: Fuzz guard, parser, canonical format and SPL
        run: |
          for target in guard parsers parser_syslog parser_linux parser_ecs parser_ocsf parser_velociraptor parser_hayabusa parser_chainsaw parser_plaso parser_eztools parser_declarative canonical spl; do
            cargo fuzz run "$target" -- -max_total_time=600 -rss_limit_mb=2048 -verbosity=0
          done
      - name: Fuzz exported packages within memory budget
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 0
        run: cargo fuzz run export --features export --sanitizer none -- -max_total_time=600 -rss_limit_mb=2048 -verbosity=0
      - name: Delete fuzz artifacts and temporary corpora
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('.tools', 'fuzz/artifacts', 'fuzz/corpus')) if p.is_dir()]"

  evtx:
    if: inputs.native_windows != true && inputs.linux_compatibility != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {key: evtx-asan-fuzz, workspaces: 'helpers/evtx/fuzz -> target'}
      - name: Install the verified upstream cargo-fuzz binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tools
          gh release download 0.13.2 -R rust-fuzz/cargo-fuzz -p cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz -O .tools/cargo-fuzz.tar.gz
          printf '%s  %s\n' b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c .tools/cargo-fuzz.tar.gz | sha256sum --check
          tar -xzf .tools/cargo-fuzz.tar.gz -C .tools
          install -m 0755 .tools/cargo-fuzz "$HOME/.cargo/bin/cargo-fuzz"
      - name: Fuzz isolated-workspace decoder and parent protocol with AddressSanitizer
        run: |
          mkdir -p helpers/evtx/fuzz/corpus/evtx_decode helpers/evtx/fuzz/corpus/evtx_protocol
          cp helpers/evtx/fuzz/seeds/security.evtx helpers/evtx/fuzz/corpus/evtx_decode/
          cp helpers/evtx/fuzz/seeds/protocol/* helpers/evtx/fuzz/corpus/evtx_protocol/
          cargo fuzz run evtx_decode --fuzz-dir helpers/evtx/fuzz --sanitizer address -- -max_total_time=3600 -rss_limit_mb=1024 -timeout=30 -max_len=131072
          cargo fuzz run evtx_protocol --fuzz-dir helpers/evtx/fuzz --sanitizer address -- -max_total_time=600 -rss_limit_mb=1024 -timeout=10 -max_len=4194304
      - name: Remove temporary corpora and artifacts
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('.tools', 'helpers/evtx/fuzz/corpus', 'helpers/evtx/fuzz/artifacts')) if p.is_dir()]"

  evtx_windows:
    if: github.event_name == 'workflow_dispatch' && inputs.native_windows == true
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-msvc-${{ hashFiles('Cargo.lock', 'helpers/evtx/Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - name: Record native OS and session versions
        shell: pwsh
        run: |
          (Get-CimInstance Win32_OperatingSystem).Version
          (Get-Process -Id $PID).SessionId
          Get-Service -Name BFE,MpsSvc | ForEach-Object { "$($_.Name)=$($_.Status)" }
      - name: Check native handle metadata before compiling the decoder harness
        run: cargo nextest run -p irmind-process-containment --cargo-profile ci --locked -E 'test(handle_snapshot) | test(runtime_directory) | test(network)'
      - name: Run the production decoder under the unchanged native containment policy
        shell: pwsh
        env:
          STATIC_CRT: ${{ inputs.static_crt }}
        run: |
          if ($env:STATIC_CRT -eq 'true') {
            python helpers/evtx/test.py '--decoder-rustflags=-C target-feature=+crt-static'
          } else {
            python helpers/evtx/test.py
          }
          if ($LASTEXITCODE -ne 0) { throw 'native EVTX containment suite failed' }
      - name: Inspect only DLL names after a native failure
        if: failure()
        shell: pwsh
        run: python .github/scripts/inspect_evtx_windows.py target/x86_64-pc-windows-msvc/ci/irmind-evtx.exe
      - name: Inspect only the helper fault module and status
        if: failure()
        shell: pwsh
        run: |
          $events = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -MaxEvents 64 -ErrorAction SilentlyContinue
          foreach ($event in $events) {
            [xml]$xml = $event.ToXml()
            $fields = @{}
            foreach ($data in $xml.Event.EventData.Data) {
              if ($data.Name) { $fields[$data.Name] = [string]$data.'#text' }
            }
            if ([IO.Path]::GetFileName($fields['AppName']) -eq 'irmind-evtx.exe') {
              @{event_id=$event.Id; module=[IO.Path]::GetFileName($fields['ModuleName']); exception=$fields['ExceptionCode']} | ConvertTo-Json -Compress
            }
          }


  evtx_linux_diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_compatibility == true
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: evtx-ubuntu-22.04-${{ hashFiles('helpers/evtx/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: CARGO_TARGET_DIR=target cargo build --manifest-path helpers/evtx/Cargo.toml --bin irmind-evtx --profile ci --locked
      - run: python3 .github/scripts/check_evtx_linux.py target/ci/irmind-evtx
