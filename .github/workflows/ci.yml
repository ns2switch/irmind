name: Rust CI
on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify DCO sign-off on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_dco.py
  linux:
    needs: dco
    if: ${{ !cancelled() && (needs.dco.result == 'success' || needs.dco.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {key: linux-checks}
      - run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: 'cargo-nextest,cargo-deny,cargo-audit', fallback: none}
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --all-features --profile ci --locked -- -D warnings
      - run: cargo nextest run --workspace --all-features --cargo-profile ci --locked
      - run: cargo test -p irmind-testkit --test dependency_direction --profile ci --locked
      - run: cargo deny check --hide-inclusion-graph
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check --hide-inclusion-graph
      - run: cargo audit --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372
      - run: cargo build --release -p irmind --locked
      - name: Package unsigned binary and checksum
        run: |
          mkdir -p dist
          cp target/release/irmind dist/irmind
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum irmind LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: irmind-linux, path: dist/, if-no-files-found: error}
      - run: IRMIND_PORTABLE_EXPORT_DIR="$GITHUB_WORKSPACE/portable-export" cargo test -p irmind --test verify_export_no_keyring portable_export_fixture --profile ci --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: portable-export-linux, path: portable-export/, if-no-files-found: error}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'portable-export')) if p.is_dir()]"
  windows:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {targets: x86_64-pc-windows-msvc}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {key: windows-msvc-tests}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - run: cargo nextest run --workspace --all-features --cargo-profile ci --locked
      - run: cargo build --release -p irmind --locked
      - name: Package unsigned binary and checksum
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/irmind.exe dist/irmind.exe
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          python -c "from pathlib import Path; import hashlib; root=Path('dist'); names=('irmind.exe','LICENSE-MIT','LICENSE-APACHE','THIRD_PARTY_NOTICES.md'); (root/'SHA256SUMS').write_bytes(''.join(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n' for name in names).encode('ascii'))"
          python -c "from pathlib import Path; assert b'\r' not in Path('dist/SHA256SUMS').read_bytes()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: irmind-windows, path: dist/, if-no-files-found: error}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-linux, path: foreign-export}
      - name: Verify Linux export on Windows
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          ./dist/irmind.exe verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - run: IRMIND_PORTABLE_EXPORT_DIR="$GITHUB_WORKSPACE/portable-export" cargo test -p irmind --test verify_export_no_keyring portable_export_fixture --profile ci --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: portable-export-windows, path: portable-export/, if-no-files-found: error}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'foreign-export', 'portable-export')) if p.is_dir()]"
  linux_verify_windows:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-linux, path: bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-windows, path: foreign-export}
      - run: (cd bin && sha256sum --check SHA256SUMS) && chmod +x bin/irmind && bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('bin', 'foreign-export')) if p.is_dir()]"
  macos:
    if: ${{ !cancelled() && needs.linux.result == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: linux
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {targets: aarch64-apple-darwin}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: {key: macos-arm64-tests}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - run: cargo nextest run --workspace --all-features --cargo-profile ci --locked
      - run: cargo build --release -p irmind --locked
      - name: Package unsigned binary and checksum
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/irmind dist/irmind
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          (cd dist && shasum -a 256 irmind LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: irmind-macos-arm64, path: dist/, if-no-files-found: error}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-linux, path: foreign-export}
      - name: Verify Linux export on macOS
        run: (cd dist && shasum -a 256 -c SHA256SUMS) && chmod +x dist/irmind && dist/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'foreign-export')) if p.is_dir()]"
  macos_verify_windows:
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    needs: [macos, windows]
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-macos-arm64, path: bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-windows, path: foreign-export}
      - run: (cd bin && shasum -a 256 -c SHA256SUMS) && chmod +x bin/irmind && bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('bin', 'foreign-export')) if p.is_dir()]"
