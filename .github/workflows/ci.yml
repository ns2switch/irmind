name: Rust CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      profile_linux:
        description: Profile the Linux build only
        type: boolean
        default: false
      release_dry_run:
        description: Build and cross-verify unsigned release artifacts without creating a tag or release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_STRIP: symbols
jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
      platforms: ${{ steps.scope.outputs.platforms }}
      cross_verify: ${{ steps.scope.outputs.cross_verify }}
      release_build: ${{ steps.scope.outputs.release_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Select CI scope and skip stale nightly runs
        id: scope
        run: python3 .github/scripts/select_ci_scope.py
      - name: Verify DCO sign-off on every PR commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_dco.py
  linux:
    needs: dco
    if: ${{ !cancelled() && needs.dco.result == 'success' && needs.dco.outputs.run_ci == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {components: 'rustfmt, clippy'}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.95.0-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust_cache
        with:
          key: linux-ubuntu22-mold-${{ hashFiles('Cargo.lock', 'helpers/evtx/Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report dependency cache restoration
        run: |
          echo "Rust dependency cache exact hit: ${{ steps.rust_cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the pinned prebuilt linker
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2, reviewed mold manifest
        with: {tool: 'mold@2.42.1', checksum: true, fallback: none}
      - run: mold --version
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: 'cargo-nextest,cargo-deny', fallback: none}
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_select_ci_scope.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_release_json_features.py
      - name: Test allocation profile attribution
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_profile_pipeline_allocations.py
      - name: Test current absolute benchmark criteria
        run: |
          python3 -B .github/scripts/test_collect_graph_metrics.py
          python3 -B .github/scripts/test_evaluate_v3_gates.py
      - run: sh -n install.sh
      - run: python3 -B scripts/test_install_sh.py
      - run: cargo fmt --all -- --check
      - run: python3 scripts/check_no_rust_includes.py
      - run: python3 scripts/code_metrics.py --check-audit-literals
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Cargo build timings (manual profiling only)
        if: github.event_name == 'workflow_dispatch' && inputs.profile_linux == true
        run: cargo build --timings --workspace --all-features --profile ci --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.profile_linux == true
        with: {name: linux-cargo-timings, path: target/cargo-timings/, if-no-files-found: error}
      - name: Clippy (CI profile)
        run: cargo clippy --workspace --all-targets --all-features --profile ci --locked -- -D warnings
      - name: Test verified installer behavior without network
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_installers.py
      - name: Check the first-party unsafe boundary
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_unsafe_boundary.py
          python3 .github/scripts/check_unsafe_boundary.py
      - name: Lint and test the separately resolved EVTX helper
        run: |
          cargo fmt --manifest-path helpers/evtx/Cargo.toml --all --check
          cargo clippy --manifest-path helpers/evtx/Cargo.toml --all-targets --profile ci --locked -- -D warnings
          python3 helpers/evtx/test.py
          python3 .github/scripts/check_evtx_linux.py target/ci/irmind-evtx native-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.platforms == 'true' && needs.dco.outputs.release_build != 'true'
        with: {name: evtx-linux-ci, path: target/ci/irmind-evtx, if-no-files-found: error}
      - name: Nextest (CI profile)
        run: cargo nextest run --workspace --all-features --cargo-profile ci --locked
      - run: cargo deny check --hide-inclusion-graph
      - run: cargo deny --manifest-path helpers/evtx/Cargo.toml --config deny.toml check --hide-inclusion-graph
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check --hide-inclusion-graph
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        if: github.event_name == 'schedule'
        with: {tool: 'cargo-audit', fallback: none}
      - if: github.event_name == 'schedule'
        run: cargo audit --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372
      - name: Stage CLI test executable for cross-platform verification
        if: needs.dco.outputs.cross_verify == 'true'
        run: mkdir -p verify-bin && cp target/ci/irmind verify-bin/irmind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: verify-test-linux, path: verify-bin/, if-no-files-found: error}
      - name: Check shipped JSON feature isolation
        if: needs.dco.outputs.release_build == 'true'
        run: python .github/scripts/check_release_json_features.py
      - name: Build unsigned release binary for tag, nightly code change, or manual dry run
        if: needs.dco.outputs.release_build == 'true'
        run: |
          cargo build --release -p irmind --locked
          cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked
      - name: Check links and documented CLI commands against the built test binary
        run: python3 .github/scripts/check_docs.py --binary target/ci/irmind
      - name: Package unsigned binary and checksum
        if: needs.dco.outputs.release_build == 'true'
        run: |
          mkdir -p dist
          cp target/release/irmind target/release/irmind-evtx dist/
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 dist/
          (cd dist && sha256sum irmind irmind-evtx LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.release_build == 'true'
        with: {name: irmind-linux, path: dist/, if-no-files-found: error}
      - if: needs.dco.outputs.cross_verify == 'true'
        run: IRMIND_PORTABLE_EXPORT_DIR="$GITHUB_WORKSPACE/portable-export" cargo nextest run -p irmind --test verify_export_no_keyring --all-features --cargo-profile ci --locked -E 'test(portable_export_fixture)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-linux, path: portable-export/, if-no-files-found: error}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'portable-export', 'verify-bin')) if p.is_dir()]"
  json_formats:
    needs: [linux, dco]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: json-formats-${{ hashFiles('Cargo.lock', 'helpers/evtx/Cargo.lock') }}
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - name: Check historical artifacts and all JSON parser paths with insertion-ordered JSON enabled
        env:
          IRMIND_EXPECT_PRESERVE_ORDER: '1'
        run: |
          cargo nextest run -p irmind --test format_goldens --all-features --features serde_json/preserve_order --cargo-profile ci --locked
          cargo nextest run -p irmind-domain -p irmind-app -p irmind-infra --lib --features serde_json/preserve_order --cargo-profile ci --locked -E 'test(skill)'
          cargo nextest run -p irmind-mapping-tables -p irmind-mod-mapping-cloudtrail -p irmind-mod-parser-evtx -p irmind-mod-mapping-evtx --lib --features serde_json/preserve_order --cargo-profile ci --locked
          cargo nextest run -p irmind-mod-siem-elastic -p irmind-mod-siem-chronicle -p irmind-mod-mapping-ecs -p irmind-mod-mapping-udm --lib --features serde_json/preserve_order --cargo-profile ci --locked
          cargo nextest run --lib --features serde_json/preserve_order --cargo-profile ci --locked \
            -p irmind-mod-parser-json -p irmind-mod-parser-ecs -p irmind-mod-parser-ocsf \
            -p irmind-mod-parser-velociraptor -p irmind-mod-parser-hayabusa \
            -p irmind-mod-parser-chainsaw -p irmind-mod-parser-plaso -p irmind-mod-parser-eztools \
            -p irmind-mod-parser-zeek -p irmind-mod-parser-suricata -p irmind-mod-parser-linux \
            -p irmind-mod-parser-syslog -p irmind-mod-parser-declarative
  evtx_linux_compatibility:
    needs: [dco, linux]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.platforms == 'true' && inputs.profile_linux != true }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.release_build == 'true'
        with: {name: irmind-linux, path: compatibility-bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.release_build != 'true'
        with: {name: evtx-linux-ci, path: compatibility-bin}
      - name: Test the same baseline binary on Ubuntu and pinned Debian/Fedora userspaces
        run: |
          chmod +x compatibility-bin/irmind-evtx
          python3 .github/scripts/check_evtx_linux.py compatibility-bin/irmind-evtx
      - name: Remove downloaded compatibility binaries
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; p=Path('compatibility-bin'); p.is_dir() and rmtree(p)"
  linux_arm64:
    needs: [linux, dco]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.release_build == 'true' && inputs.profile_linux != true }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {targets: aarch64-unknown-linux-gnu}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-arm64-${{ hashFiles('Cargo.lock', 'helpers/evtx/Cargo.lock') }}
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check shipped JSON feature isolation
        run: python .github/scripts/check_release_json_features.py
      - run: |
          cargo build --release -p irmind --locked
          cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked
      - name: Verify native ARM64 containment and inherited-file decoding
        run: python3 .github/scripts/check_evtx_linux.py target/release/irmind-evtx native-only
      - name: Package ARM64 binary and checksum
        run: |
          mkdir -p dist
          cp target/release/irmind target/release/irmind-evtx dist/
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 dist/
          (cd dist && sha256sum irmind irmind-evtx LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: irmind-linux-arm64, path: dist/, if-no-files-found: error}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; p=Path('dist'); rmtree(p) if p.is_dir() else None"
  windows:
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.platforms == 'true' && inputs.profile_linux != true }}
    needs: [linux, dco]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      IRMIND_EVTX_HELPER_TEST: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/ci/irmind-evtx.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {targets: x86_64-pc-windows-msvc, components: clippy}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.95.0-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-msvc-${{ hashFiles('Cargo.lock', 'helpers/evtx/Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - name: Test verified installer behavior without network
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_installers.py
      - name: Check the first-party unsafe boundary
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_unsafe_boundary.py
          python3 .github/scripts/check_unsafe_boundary.py
      - name: Record the native Windows version
        run: python -c "import platform; print(platform.win32_ver())"
      - name: Lint the Windows native containment boundary
        run: cargo clippy -p irmind-process-containment --all-targets --profile ci --locked -- -D warnings
      - name: Build and test the separately resolved EVTX helper
        run: |
          python3 helpers/evtx/test.py
      - name: Inspect helper DLL imports after native startup failure
        if: failure()
        run: python3 .github/scripts/inspect_evtx_windows.py target/x86_64-pc-windows-msvc/ci/irmind-evtx.exe
      - run: cargo nextest run --workspace --all-features --cargo-profile ci --locked --no-fail-fast
      - name: Parse the PowerShell installer without running it
        run: |
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { throw ($errors -join "`n") }'
      - name: Stage CLI test executable for cross-platform verification
        if: needs.dco.outputs.cross_verify == 'true'
        run: mkdir -p verify-bin && cp target/x86_64-pc-windows-msvc/ci/irmind.exe verify-bin/irmind.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: verify-test-windows, path: verify-bin/, if-no-files-found: error}
      - name: Check shipped JSON feature isolation
        if: needs.dco.outputs.release_build == 'true'
        run: python .github/scripts/check_release_json_features.py
      - name: Build unsigned release binary for tag, nightly code change, or manual dry run
        if: needs.dco.outputs.release_build == 'true'
        run: |
          cargo build --release -p irmind --locked
          cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked
      - name: Measure the release witness and 300 small distinct EVTX sources
        if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true
        run: |
          cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked --example collection
          cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked --bin irmind-evtx
          target/x86_64-pc-windows-msvc/release/examples/collection.exe > evtx-collection.json
          cat evtx-collection.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true
        with: {name: evtx-windows-collection, path: evtx-collection.json, if-no-files-found: error}
      - name: Package unsigned binary and checksum
        if: needs.dco.outputs.release_build == 'true'
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/irmind.exe target/x86_64-pc-windows-msvc/release/irmind-evtx.exe dist/
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 dist/
          python -c "from pathlib import Path; import hashlib; root=Path('dist'); names=('irmind.exe','irmind-evtx.exe','LICENSE-MIT','LICENSE-APACHE','THIRD_PARTY_NOTICES.md','install.sh','install.ps1'); (root/'SHA256SUMS').write_bytes(''.join(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n' for name in names).encode('ascii'))"
          python -c "from pathlib import Path; assert b'\r' not in Path('dist/SHA256SUMS').read_bytes()"
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.release_build == 'true'
        with: {name: irmind-windows, path: dist/, if-no-files-found: error}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-linux, path: foreign-export}
      - name: Verify Linux export on Windows
        if: needs.dco.outputs.cross_verify == 'true'
        run: |
          ./verify-bin/irmind.exe verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - if: needs.dco.outputs.cross_verify == 'true'
        run: IRMIND_PORTABLE_EXPORT_DIR="$GITHUB_WORKSPACE/portable-export" cargo nextest run -p irmind --test verify_export_no_keyring --all-features --cargo-profile ci --locked -E 'test(portable_export_fixture)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-windows, path: portable-export/, if-no-files-found: error}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'foreign-export', 'portable-export', 'verify-bin')) if p.is_dir()]; Path('evtx-collection.json').unlink(missing_ok=True)"
  linux_verify_windows:
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.dco.outputs.cross_verify == 'true' }}
    needs: [windows, dco]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verify-test-linux, path: bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-windows, path: foreign-export}
      - run: chmod +x bin/irmind && bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('bin', 'foreign-export')) if p.is_dir()]"
  macos:
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.platforms == 'true' && inputs.profile_linux != true }}
    needs: [linux, dco]
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {targets: aarch64-apple-darwin}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.95.0-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-arm64-${{ hashFiles('Cargo.lock', 'helpers/evtx/Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - name: Test verified installer behavior without network
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_installers.py
      - name: Check the first-party unsafe boundary
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_unsafe_boundary.py
          python3 .github/scripts/check_unsafe_boundary.py
      - name: Record the native macOS version
        run: sw_vers -productVersion
      - name: Build and test the separately resolved EVTX helper
        run: |
          python3 helpers/evtx/test.py
      - name: Inspect sandbox launch diagnostics after a native helper failure
        if: failure()
        run: /usr/bin/log show --last 2m --style compact --predicate '(process == "kernel" OR process == "sandboxd") AND eventMessage CONTAINS "irmind-evtx"'
      - run: cargo nextest run --workspace --all-features --cargo-profile ci --locked --test-threads 4
      - name: Stage CLI test executable for cross-platform verification
        if: needs.dco.outputs.cross_verify == 'true'
        run: mkdir -p verify-bin && cp target/aarch64-apple-darwin/ci/irmind verify-bin/irmind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: verify-test-macos, path: verify-bin/, if-no-files-found: error}
      - name: Check shipped JSON feature isolation
        if: needs.dco.outputs.release_build == 'true'
        run: python .github/scripts/check_release_json_features.py
      - name: Build unsigned release binary for tag, nightly code change, or manual dry run
        if: needs.dco.outputs.release_build == 'true'
        run: |
          cargo build --release -p irmind --locked
          cargo build --manifest-path helpers/evtx/Cargo.toml --release --locked
      - name: Package unsigned binary and checksum
        if: needs.dco.outputs.release_build == 'true'
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/irmind target/aarch64-apple-darwin/release/irmind-evtx dist/
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 dist/
          (cd dist && shasum -a 256 irmind irmind-evtx LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 > SHA256SUMS)
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.release_build == 'true'
        with: {name: irmind-macos-arm64, path: dist/, if-no-files-found: error}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-linux, path: foreign-export}
      - name: Verify Linux export on macOS
        if: needs.dco.outputs.cross_verify == 'true'
        run: verify-bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'foreign-export', 'verify-bin')) if p.is_dir()]"
  macos_verify_windows:
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.dco.outputs.cross_verify == 'true' }}
    needs: [macos, windows, dco]
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verify-test-macos, path: bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-windows, path: foreign-export}
      - run: chmod +x bin/irmind && bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('bin', 'foreign-export')) if p.is_dir()]"
  release:
    needs: [dco, linux, json_formats, linux_arm64, windows, macos, evtx_linux_compatibility, linux_verify_windows, macos_verify_windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.json_formats.result == 'success' && needs.linux_arm64.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux_verify_windows.result == 'success' && needs.macos_verify_windows.result == 'success' && needs.evtx_linux_compatibility.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-linux, path: artifacts/linux-x86_64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-linux-arm64, path: artifacts/linux-aarch64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-macos-arm64, path: artifacts/macos-aarch64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-windows, path: artifacts/windows-x86_64}
      - name: Stage binaries and install scripts
        run: |
          mkdir -p release
          cp artifacts/linux-x86_64/irmind release/irmind-linux-x86_64
          cp artifacts/linux-x86_64/irmind-evtx release/irmind-evtx-linux-x86_64
          cp artifacts/linux-aarch64/irmind release/irmind-linux-aarch64
          cp artifacts/linux-aarch64/irmind-evtx release/irmind-evtx-linux-aarch64
          cp artifacts/macos-aarch64/irmind release/irmind-macos-aarch64
          cp artifacts/macos-aarch64/irmind-evtx release/irmind-evtx-macos-aarch64
          cp artifacts/windows-x86_64/irmind.exe release/irmind-windows-x86_64.exe
          cp artifacts/windows-x86_64/irmind-evtx.exe release/irmind-evtx-windows-x86_64.exe
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 release/
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release/IRMind-SBOM.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: helpers/evtx
          format: spdx-json
          output-file: release/IRMind-EVTX-SBOM.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: 'cargo-geiger@0.13.0', fallback: cargo-binstall}
        env:
          BINSTALL_STRATEGIES: quick-install
          BINSTALL_DISABLE_STRATEGIES: compile
          BINSTALL_NO_DISCOVER_GITHUB_TOKEN: 'true'
          BINSTALL_DISABLE_TELEMETRY: 'true'
      - name: Verify the prebuilt unsafe-audit tool before execution
        run: |
          python3 - <<'PYTHON'
          import hashlib, shutil
          from pathlib import Path
          digest = hashlib.sha256(Path(shutil.which('cargo-geiger')).read_bytes()).hexdigest()
          assert digest in {
              '0c2c662ff98f3d206af915ba8a60cedb91eec7f75b856e80c6b8f6224176db16',
              'dc13a40bc8bfefc8cef434b3b2c1be3f1d3cf90494615533074d62758c746f62',
          }, 'unrecognized cargo-geiger 0.13.0 prebuilt binary'
          PYTHON
      - name: Inventory the separately locked helper native surface
        run: python3 .github/scripts/report_evtx_unsafe.py > release/EVTX-UNSAFE-REPORT.json
      - name: Audit the separately locked helper with cargo-geiger
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_normalize_evtx_geiger.py
          cargo geiger --manifest-path "$PWD/helpers/evtx/Cargo.toml" --all-targets --locked --output-format Json > "$RUNNER_TEMP/evtx-geiger.json" 2> "$RUNNER_TEMP/evtx-geiger.log"
          python3 .github/scripts/normalize_evtx_geiger.py --diagnostics "$RUNNER_TEMP/evtx-geiger.log" --inventory release/EVTX-UNSAFE-REPORT.json < "$RUNNER_TEMP/evtx-geiger.json" > release/EVTX-GEIGER-REPORT.json
          rm "$RUNNER_TEMP/evtx-geiger.json" "$RUNNER_TEMP/evtx-geiger.log"
      - name: Create and check the release checksum list
        run: |
          (cd release && sha256sum irmind-linux-x86_64 irmind-linux-aarch64 irmind-macos-aarch64 irmind-windows-x86_64.exe irmind-evtx-linux-x86_64 irmind-evtx-linux-aarch64 irmind-evtx-macos-aarch64 irmind-evtx-windows-x86_64.exe install.sh install.ps1 IRMind-SBOM.spdx.json IRMind-EVTX-SBOM.spdx.json EVTX-UNSAFE-REPORT.json EVTX-GEIGER-REPORT.json LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md > SHA256SUMS)
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'release/irmind-*'}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'release/*SBOM.spdx.json'}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'} # fixes GHSA-fx35-mq7g-6g98 in the bundled default
      - name: Sign every binary and the checksum list with GitHub OIDC
        run: |
          for file in release/irmind-linux-x86_64 release/irmind-linux-aarch64 release/irmind-macos-aarch64 release/irmind-windows-x86_64.exe release/irmind-evtx-linux-x86_64 release/irmind-evtx-linux-aarch64 release/irmind-evtx-macos-aarch64 release/irmind-evtx-windows-x86_64.exe release/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Verify every Sigstore bundle against this exact workflow ref
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          for file in release/irmind-linux-x86_64 release/irmind-linux-aarch64 release/irmind-macos-aarch64 release/irmind-windows-x86_64.exe release/irmind-evtx-linux-x86_64 release/irmind-evtx-linux-aarch64 release/irmind-evtx-macos-aarch64 release/irmind-evtx-windows-x86_64.exe release/SHA256SUMS; do
            cosign verify-blob "$file" --bundle "$file.sigstore.json" --certificate-identity "$EXPECTED_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with: {name: signed-release-dry-run, path: release/, if-no-files-found: error}
      - name: Publish the signed prerelease only for an existing tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --generate-notes --title "IRMind $GITHUB_REF_NAME"
          fi
      - name: Clean release staging
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('release', 'artifacts')) if p.is_dir()]"
  verify_install_linux:
    needs: release
    if: ${{ needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Install and run the verified Linux release in a clean runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e "$HOME/.local/bin/irmind"
          test ! -e "$HOME/.local/bin/irmind-evtx"
          trap 'rm -f "$HOME/.local/bin/irmind" "$HOME/.local/bin/irmind-evtx"' EXIT
          sh install.sh "$GITHUB_REF_NAME"
          test -x "$HOME/.local/bin/irmind-evtx"
          "$HOME/.local/bin/irmind" --version
  verify_install_windows:
    needs: release
    if: ${{ needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'}
      - name: Install and run the verified Windows release in a clean runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $binary = Join-Path $env:LOCALAPPDATA 'IRMind\bin\irmind.exe'
          $helper = Join-Path $env:LOCALAPPDATA 'IRMind\bin\irmind-evtx.exe'
          if (Test-Path -LiteralPath $helper) { throw 'helper installer target is not clean' }
          if (Test-Path -LiteralPath $binary) { throw 'installer target is not clean' }
          try {
            ./install.ps1 -Version $env:GITHUB_REF_NAME
            if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'verified helper is missing' }
            & $binary --version
            if ($LASTEXITCODE -ne 0) { throw 'verified binary did not start' }
          } finally {
            Remove-Item -LiteralPath $binary,$helper -Force -ErrorAction SilentlyContinue
          }
