name: Rust CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      profile_linux:
        description: Profile the Linux build only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
      platforms: ${{ steps.scope.outputs.platforms }}
      cross_verify: ${{ steps.scope.outputs.cross_verify }}
      release_build: ${{ steps.scope.outputs.release_build }}
      duckdb_version: ${{ steps.scope.outputs.duckdb_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Select CI scope and skip stale nightly runs
        id: scope
        run: python3 .github/scripts/select_ci_scope.py
      - name: Verify DCO sign-off on every PR commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_dco.py
  linux:
    needs: dco
    if: ${{ !cancelled() && needs.dco.result == 'success' && needs.dco.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {components: 'rustfmt, clippy'}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.95.0-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust_cache
        with:
          key: linux-mold-duckdb-${{ needs.dco.outputs.duckdb_version }}-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report dependency cache restoration
        run: |
          echo "Rust dependency cache exact hit: ${{ steps.rust_cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: 'cargo-nextest,cargo-deny', fallback: none}
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_select_ci_scope.py
      - run: cargo fmt --all -- --check
      - run: python3 scripts/check_no_rust_includes.py
      - run: python3 scripts/code_metrics.py --check-audit-literals
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Cargo build timings (manual profiling only)
        if: github.event_name == 'workflow_dispatch' && inputs.profile_linux == true
        run: cargo build --timings --workspace --all-features --profile ci --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.profile_linux == true
        with: {name: linux-cargo-timings, path: target/cargo-timings/, if-no-files-found: error}
      - name: Clippy (CI profile)
        run: cargo clippy --workspace --all-targets --all-features --profile ci --locked -- -D warnings
      - name: Nextest (CI profile)
        run: cargo nextest run --workspace --all-features --cargo-profile ci --locked
      - run: cargo deny check --hide-inclusion-graph
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check --hide-inclusion-graph
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        if: github.event_name == 'schedule'
        with: {tool: 'cargo-audit', fallback: none}
      - if: github.event_name == 'schedule'
        run: cargo audit --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372
      - name: Stage CLI test executable for cross-platform verification
        if: needs.dco.outputs.cross_verify == 'true'
        run: mkdir -p verify-bin && cp target/ci/irmind verify-bin/irmind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: verify-test-linux, path: verify-bin/, if-no-files-found: error}
      - name: Build unsigned release binary with default product modules for tag or nightly code change
        if: needs.dco.outputs.release_build == 'true'
        run: cargo build --release -p irmind --locked
      - name: Check links and documented CLI commands against the built test binary
        run: python3 .github/scripts/check_docs.py --binary target/ci/irmind
      - name: Package unsigned binary and checksum
        if: needs.dco.outputs.release_build == 'true'
        run: |
          mkdir -p dist
          cp target/release/irmind dist/irmind
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum irmind LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.release_build == 'true'
        with: {name: irmind-linux, path: dist/, if-no-files-found: error}
      - if: needs.dco.outputs.cross_verify == 'true'
        run: IRMIND_PORTABLE_EXPORT_DIR="$GITHUB_WORKSPACE/portable-export" cargo nextest run -p irmind --test verify_export_no_keyring --all-features --cargo-profile ci --locked -E 'test(portable_export_fixture)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-linux, path: portable-export/, if-no-files-found: error}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'portable-export', 'verify-bin')) if p.is_dir()]"
  windows:
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.platforms == 'true' && inputs.profile_linux != true }}
    needs: [linux, dco]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {targets: x86_64-pc-windows-msvc}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.95.0-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-msvc-duckdb-${{ needs.dco.outputs.duckdb_version }}-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - run: cargo nextest run --workspace --all-features --cargo-profile ci --locked
      - name: Stage CLI test executable for cross-platform verification
        if: needs.dco.outputs.cross_verify == 'true'
        run: mkdir -p verify-bin && cp target/x86_64-pc-windows-msvc/ci/irmind.exe verify-bin/irmind.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: verify-test-windows, path: verify-bin/, if-no-files-found: error}
      - name: Build unsigned release binary for tag or nightly code change
        if: needs.dco.outputs.release_build == 'true'
        run: cargo build --release -p irmind --locked
      - name: Package unsigned binary and checksum
        if: needs.dco.outputs.release_build == 'true'
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/irmind.exe dist/irmind.exe
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          python -c "from pathlib import Path; import hashlib; root=Path('dist'); names=('irmind.exe','LICENSE-MIT','LICENSE-APACHE','THIRD_PARTY_NOTICES.md'); (root/'SHA256SUMS').write_bytes(''.join(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n' for name in names).encode('ascii'))"
          python -c "from pathlib import Path; assert b'\r' not in Path('dist/SHA256SUMS').read_bytes()"
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.release_build == 'true'
        with: {name: irmind-windows, path: dist/, if-no-files-found: error}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-linux, path: foreign-export}
      - name: Verify Linux export on Windows
        if: needs.dco.outputs.cross_verify == 'true'
        run: |
          ./verify-bin/irmind.exe verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - if: needs.dco.outputs.cross_verify == 'true'
        run: IRMIND_PORTABLE_EXPORT_DIR="$GITHUB_WORKSPACE/portable-export" cargo nextest run -p irmind --test verify_export_no_keyring --all-features --cargo-profile ci --locked -E 'test(portable_export_fixture)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-windows, path: portable-export/, if-no-files-found: error}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'foreign-export', 'portable-export', 'verify-bin')) if p.is_dir()]"
  linux_verify_windows:
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.dco.outputs.cross_verify == 'true' }}
    needs: [windows, dco]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verify-test-linux, path: bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-windows, path: foreign-export}
      - run: chmod +x bin/irmind && bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('bin', 'foreign-export')) if p.is_dir()]"
  macos:
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.platforms == 'true' && inputs.profile_linux != true }}
    needs: [linux, dco]
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with: {targets: aarch64-apple-darwin}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.95.0-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-arm64-duckdb-${{ needs.dco.outputs.duckdb_version }}-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - run: cargo nextest run --workspace --all-features --cargo-profile ci --locked --test-threads 4
      - name: Stage CLI test executable for cross-platform verification
        if: needs.dco.outputs.cross_verify == 'true'
        run: mkdir -p verify-bin && cp target/aarch64-apple-darwin/ci/irmind verify-bin/irmind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: verify-test-macos, path: verify-bin/, if-no-files-found: error}
      - name: Build unsigned release binary for tag or nightly code change
        if: needs.dco.outputs.release_build == 'true'
        run: cargo build --release -p irmind --locked
      - name: Package unsigned binary and checksum
        if: needs.dco.outputs.release_build == 'true'
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/irmind dist/irmind
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md dist/
          (cd dist && shasum -a 256 irmind LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md > SHA256SUMS)
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.release_build == 'true'
        with: {name: irmind-macos-arm64, path: dist/, if-no-files-found: error}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-linux, path: foreign-export}
      - name: Verify Linux export on macOS
        if: needs.dco.outputs.cross_verify == 'true'
        run: verify-bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('dist', 'foreign-export', 'verify-bin')) if p.is_dir()]"
  macos_verify_windows:
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.dco.outputs.cross_verify == 'true' }}
    needs: [macos, windows, dco]
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verify-test-macos, path: bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-windows, path: foreign-export}
      - run: chmod +x bin/irmind && bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('bin', 'foreign-export')) if p.is_dir()]"
