name: Rust CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    - cron: '17 3 * * 0'
    - cron: '17 3 * * 1-6'
  workflow_dispatch:
    inputs:
      profile_linux:
        description: Profile the Linux build only
        type: boolean
        default: false
      release_dry_run:
        description: Rehearse the full release job through packaging, signing and verification without publishing
        type: boolean
        default: false
      release_profile_benchmark:
        description: Compare the default release profile with ThinLTO on synthetic evidence
        type: boolean
        default: false
      release_profile_reproducibility:
        description: Compare mapping identities and reproducibility on all release targets
        type: boolean
        default: false
      release_binary_reproducibility:
        description: Check reproducible binaries and portable Sigma cases only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # An unrelated label must not cancel a run that supplies the required checks.
  group: rust-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'full-ci' && 'ignored-label' || (github.event_name == 'schedule' && 'nightly' || 'checks') }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_STRIP: symbols
jobs:
  dco:
    # Skipped label checks use different names so they cannot replace a required check.
    name: ${{ (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && 'dco' || 'dco (ignored label)' }}
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      docs_binary_run: ${{ steps.scope.outputs.docs_binary_run }}
      cache_epoch: ${{ steps.scope.outputs.cache_epoch }}
      pr_fuzz_targets: ${{ steps.fuzz.outputs.pr_targets }}
      platforms: ${{ steps.scope.outputs.platforms }}
      full_ci: ${{ steps.scope.outputs.full_ci }}
      cross_verify: ${{ steps.scope.outputs.cross_verify }}
      release_build: ${{ steps.scope.outputs.release_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Select CI scope and skip stale nightly runs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/select_ci_scope.py
      - name: Verify CI and fuzz target selection
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python3 -B .github/scripts/test_select_ci_scope.py
          python3 -B .github/scripts/test_select_fuzz_targets.py
      - name: Select required fuzz campaigns for new decoders
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        id: fuzz
        run: python3 -B .github/scripts/select_fuzz_targets.py
      - name: Verify DCO sign-off on every PR commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_dco.py
  linux:
    name: ${{ (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && 'linux' || 'linux (ignored label)' }}
    permissions:
      contents: read
      actions: read
    needs: dco
    if: ${{ !cancelled() && needs.dco.result == 'success' && needs.dco.outputs.run_ci == 'true' && (github.event_name != 'workflow_dispatch' || (!inputs.release_profile_benchmark && !inputs.release_profile_reproducibility && !inputs.release_binary_reproducibility)) }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ needs.dco.outputs.pr_fuzz_targets != '' && 360 || 120 }}
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Test documented command ownership
        run: python3 -B .github/scripts/test_check_docs.py
      - name: Download the compatible CLI from a successful main push
        if: needs.dco.outputs.docs_only == 'true' && needs.dco.outputs.docs_binary_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-cli
          path: docs-cli
          github-token: ${{ github.token }}
          run-id: ${{ needs.dco.outputs.docs_binary_run }}
      - name: Check documentation without a Rust build
        if: needs.dco.outputs.docs_only == 'true'
        env:
          DOCS_BINARY_RUN: ${{ needs.dco.outputs.docs_binary_run }}
        run: |
          if [ -n "$DOCS_BINARY_RUN" ]; then
            (cd docs-cli && sha256sum --check SHA256SUMS)
            chmod +x docs-cli/irmind
            python3 -B .github/scripts/check_docs.py --binary docs-cli/irmind
          else
            echo "No compatible main CLI artifact exists. Checking the CLI against the source."
            python3 -B .github/scripts/check_docs.py
          fi
      - uses: dtolnay/rust-toolchain@766a42937d994bd78bb4591385445c188ccb3f09 # 1.97.1
        if: needs.dco.outputs.docs_only != 'true'
        with: {components: 'rustfmt, clippy'}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        if: needs.dco.outputs.docs_only != 'true'
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.97.1-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.dco.outputs.docs_only != 'true'
        id: rust_cache
        with:
          key: linux-ubuntu22-mold-1.97.1-${{ needs.dco.outputs.cache_epoch }}
          add-rust-environment-hash-key: false
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report dependency cache restoration
        if: needs.dco.outputs.docs_only != 'true'
        run: |
          echo "Rust dependency cache exact hit: ${{ steps.rust_cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the pinned prebuilt linker
        if: needs.dco.outputs.docs_only != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2, reviewed mold manifest
        with: {tool: 'mold@2.42.1', checksum: true, fallback: none}
      - run: mold --version
        if: needs.dco.outputs.docs_only != 'true'
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        if: needs.dco.outputs.docs_only != 'true'
        with: {tool: 'cargo-nextest,cargo-deny', fallback: none}
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_release_json_features.py
        if: needs.dco.outputs.docs_only != 'true'
      - name: Resolve all locked workspaces and check shipping versions
        if: needs.dco.outputs.docs_only != 'true'
        run: python3 -B .github/scripts/check_locked_workspaces.py
      - run: python3 -B .github/scripts/check_mapping_dependency_graph.py
        if: needs.dco.outputs.docs_only != 'true'
      - run: python3 -B .github/scripts/test_native_mapping_manifest.py
        if: needs.dco.outputs.docs_only != 'true'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_sign_macos.py
        if: needs.dco.outputs.docs_only != 'true'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_hunteval_benchmark.py
        if: needs.dco.outputs.docs_only != 'true'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/real-validation/test_lab.py
        if: needs.dco.outputs.docs_only != 'true'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/real-validation/test_port_forward.py
        if: needs.dco.outputs.docs_only != 'true'
      - name: Verify the pinned offline core-skill mirror
        if: needs.dco.outputs.docs_only != 'true'
        run: |
          python3 -B scripts/skills_inventory.py
          python3 -B scripts/sync_core_skills.py
          python3 -B scripts/test_sync_core_skills.py
      - name: Test native release coverage
        if: needs.dco.outputs.docs_only != 'true'
        run: |
          python3 -B .github/scripts/test_release_platforms.py
          python3 -B .github/scripts/test_release_build_environment.py
      - name: Test release-note policy links and retry behavior
        if: needs.dco.outputs.docs_only != 'true'
        run: |
          python3 -B .github/scripts/test_release_notes.py
          python3 -B .github/scripts/test_homebrew_dispatch.py
      - name: Test allocation profile attribution
        if: needs.dco.outputs.docs_only != 'true'
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_profile_pipeline_allocations.py
      - name: Test current absolute benchmark criteria
        if: needs.dco.outputs.docs_only != 'true'
        run: |
          python3 -B .github/scripts/test_collect_graph_metrics.py
          python3 -B .github/scripts/test_evaluate_v3_gates.py
      - run: sh -n install.sh
        if: needs.dco.outputs.docs_only != 'true'
      - run: python3 -B scripts/test_install_sh.py
        if: needs.dco.outputs.docs_only != 'true'
      - run: cargo fmt --all -- --check
        if: needs.dco.outputs.docs_only != 'true'
      - run: python3 scripts/check_no_rust_includes.py
        if: needs.dco.outputs.docs_only != 'true'
      - run: python3 scripts/code_metrics.py --check-audit-literals
        if: needs.dco.outputs.docs_only != 'true'
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
        if: needs.dco.outputs.docs_only != 'true'
      - name: Cargo build timings (manual profiling only)
        if: ${{ needs.dco.outputs.docs_only != 'true' && (github.event_name == 'workflow_dispatch' && inputs.profile_linux == true) }}
        run: cargo build --timings --workspace --all-features --profile ci --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.dco.outputs.docs_only != 'true' && (github.event_name == 'workflow_dispatch' && inputs.profile_linux == true) }}
        with: {name: linux-cargo-timings, path: target/cargo-timings/, if-no-files-found: error, retention-days: 7}
      - name: Clippy (CI profile)
        if: needs.dco.outputs.docs_only != 'true'
        run: cargo clippy --workspace --all-targets --all-features --profile ci --locked -- -D warnings
      - name: Test verified installer behavior without network
        if: needs.dco.outputs.docs_only != 'true'
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_installers.py
      - name: Check the first-party unsafe boundary
        if: needs.dco.outputs.docs_only != 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_unsafe_boundary.py
          python3 .github/scripts/check_unsafe_boundary.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_date_dependencies.py
          python3 .github/scripts/check_date_dependencies.py
      - name: Lint and test the separately resolved EVTX helper
        if: needs.dco.outputs.docs_only != 'true'
        run: |
          cargo fmt --manifest-path helpers/evtx/Cargo.toml --all --check
          cargo clippy --manifest-path helpers/evtx/Cargo.toml --all-targets --profile ci --locked -- -D warnings
          python3 helpers/evtx/test.py
          python3 .github/scripts/check_evtx_linux.py target/ci/irmind-evtx native-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.dco.outputs.docs_only != 'true' && (needs.dco.outputs.platforms == 'true' && needs.dco.outputs.release_build != 'true') }}
        with: {name: evtx-linux-ci, path: target/ci/irmind-evtx, if-no-files-found: error, retention-days: 7}
      - name: Nextest (CI profile)
        if: needs.dco.outputs.docs_only != 'true'
        env:
          IRMIND_CROSS_VERIFY: ${{ needs.dco.outputs.cross_verify }}
        run: |
          if [ "$IRMIND_CROSS_VERIFY" = true ]; then
            export IRMIND_PORTABLE_EXPORT_DIR="$GITHUB_WORKSPACE/portable-export"
          fi
          cargo nextest run --workspace --all-features --cargo-profile ci --locked
      - run: cargo deny check --hide-inclusion-graph
        if: needs.dco.outputs.docs_only != 'true'
      - run: cargo deny --manifest-path helpers/evtx/Cargo.toml --config deny.toml check --hide-inclusion-graph
        if: needs.dco.outputs.docs_only != 'true'
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check --hide-inclusion-graph
        if: needs.dco.outputs.docs_only != 'true'
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        if: ${{ needs.dco.outputs.docs_only != 'true' && (github.event_name == 'schedule') }}
        with: {tool: 'cargo-audit', fallback: none}
      - if: ${{ needs.dco.outputs.docs_only != 'true' && (github.event_name == 'schedule') }}
        run: cargo audit --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372
      - name: Stage CLI test executable for cross-platform verification
        if: ${{ needs.dco.outputs.docs_only != 'true' && (needs.dco.outputs.cross_verify == 'true') }}
        run: mkdir -p verify-bin && cp target/ci/irmind verify-bin/irmind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.dco.outputs.docs_only != 'true' && (needs.dco.outputs.cross_verify == 'true') }}
        with: {name: verify-test-linux, path: verify-bin/, if-no-files-found: error, retention-days: "${{ inputs.release_dry_run && '30' || '7' }}"}
      - name: Check links and documented CLI commands against the built test binary
        if: needs.dco.outputs.docs_only != 'true'
        run: python3 .github/scripts/check_docs.py --binary target/ci/irmind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.dco.outputs.docs_only != 'true' && (needs.dco.outputs.cross_verify == 'true') }}
        with: {name: portable-export-linux, path: portable-export/, if-no-files-found: error, retention-days: "${{ inputs.release_dry_run && '30' || '7' }}"}
      - name: Install nightly Rust for new decoder campaigns
        if: needs.dco.outputs.pr_fuzz_targets != ''
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - name: Install verified cargo-fuzz
        if: needs.dco.outputs.pr_fuzz_targets != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install_cargo_fuzz.sh
      - name: Fuzz each new decoder with AddressSanitizer for ten minutes
        if: needs.dco.outputs.pr_fuzz_targets != ''
        env:
          FUZZ_TARGETS: ${{ needs.dco.outputs.pr_fuzz_targets }}
          RUSTFLAGS: ''
        run: |
          read -r -a targets <<< "$FUZZ_TARGETS"
          bash .github/scripts/run_fuzz_targets.sh pr "${targets[@]}"
      - name: Stage CLI for future documentation checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir docs-cli
          cp target/ci/irmind docs-cli/irmind
          (cd docs-cli && sha256sum irmind > SHA256SUMS)
      - name: Publish main CLI for documentation checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: docs-cli, path: docs-cli/, retention-days: 7, if-no-files-found: error}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('docs-cli', 'portable-export', 'verify-bin')) if p.is_dir()]"
  json_formats:
    needs: [linux, dco]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.run_ci == 'true' && needs.dco.outputs.docs_only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@766a42937d994bd78bb4591385445c188ccb3f09 # 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: json-formats-1.97.1-${{ needs.dco.outputs.cache_epoch }}
          add-rust-environment-hash-key: false
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - name: Check historical artifacts and all JSON parser paths with insertion-ordered JSON enabled
        env:
          IRMIND_EXPECT_PRESERVE_ORDER: '1'
        run: |
          cargo nextest run -p irmind --test format_goldens --test kubernetes_ingest --test identity_ingest --test folder_ingest --test parser_detection_matrix --all-features --features serde_json/preserve_order --cargo-profile ci --locked
          cargo nextest run -p irmind-domain -p irmind-app -p irmind-infra --lib --features serde_json/preserve_order --cargo-profile ci --locked -E 'test(skill) | test(subagent) | test(/^catalog::/) | test(case_budget) | test(case_deletion) | test(ingest_outcome) | test(cluster) | test(source_record) | test(provider_process) | test(fdr) | test(original_read) | test(source_mapping::stream::tests::replay) | test(source_queries) | test(source_query_dispatch) | test(query_capture) | test(case_created_v7) | test(export_v11_wire) | test(v11_empty_archive) | test(case_7_admission_vectors) | test(v10_proofs) | test(report_coverage) | test(mapped_export) | test(mapped_pipeline::expanded_catalog) | test(partitioning::sorting) | test(disordered_azure_wide_merge)'
          cargo nextest run -p irmind-infra --lib --features sigma,serde_json/preserve_order --cargo-profile ci --locked -E 'test(sigma)'
          cargo nextest run -p irmind-sigma --lib --cargo-profile ci --locked
          cargo nextest run -p irmind-mapping-contracts -p irmind-mapping-tables -p irmind-mod-mapping-kubernetes -p irmind-mod-mapping-falco -p irmind-mod-mapping-network -p irmind-mod-parser-fdr -p irmind-mod-mapping-fdr -p irmind-mod-parser-macos -p irmind-mod-mapping-macos -p irmind-mod-parser-google-workspace -p irmind-mod-mapping-google-workspace -p irmind-mod-parser-s3-access -p irmind-mod-mapping-s3-access -p irmind-mod-parser-elb -p irmind-mod-mapping-elb -p irmind-mod-parser-iis-w3c -p irmind-mod-mapping-iis-w3c -p irmind-mod-parser-windows-dns -p irmind-mod-mapping-windows-dns -p irmind-mod-parser-route53 -p irmind-mod-mapping-route53 -p irmind-mod-parser-github-audit -p irmind-mod-mapping-github-audit -p irmind-mod-parser-defender -p irmind-mod-mapping-defender -p irmind-mod-parser-email -p irmind-mod-mapping-email -p irmind-mod-parser-vpc-flow -p irmind-mod-parser-azure-flow -p irmind-mod-parser-gcp-flow -p irmind-mod-mapping-cloud-flow -p irmind-mod-parser-guardduty -p irmind-mod-mapping-guardduty -p irmind-mod-parser-m365 -p irmind-mod-parser-okta -p irmind-mod-mapping-identity -p irmind-mod-parser-entra -p irmind-mod-mapping-entra -p irmind-mod-parser-gcp-audit -p irmind-mod-mapping-gcp-audit -p irmind-mod-mapping-cloudtrail -p irmind-mod-parser-evtx -p irmind-mod-mapping-evtx --lib --features serde_json/preserve_order --cargo-profile ci --locked
          cargo nextest run -p irmind-llm-chat-completions -p irmind-mod-llm-anthropic --lib --features serde_json/preserve_order --cargo-profile ci --locked
          cargo nextest run -p irmind-mod-siem-elastic -p irmind-mod-siem-chronicle -p irmind-mod-mapping-ecs -p irmind-mod-mapping-udm --lib --features serde_json/preserve_order --cargo-profile ci --locked
          for manifest in crates/modules/query-*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            module=$(basename "$(dirname "$manifest")")
            cargo nextest run -p "irmind-mod-$module" --lib --features serde_json/preserve_order --cargo-profile ci --locked
          done
          cargo nextest run --lib --features serde_json/preserve_order --cargo-profile ci --locked \
            -p irmind-mod-parser-json -p irmind-mod-parser-ecs -p irmind-mod-parser-ocsf \
            -p irmind-mod-parser-velociraptor -p irmind-mod-parser-hayabusa \
            -p irmind-mod-parser-chainsaw -p irmind-mod-parser-plaso -p irmind-mod-parser-eztools \
            -p irmind-mod-parser-zeek -p irmind-mod-parser-suricata -p irmind-mod-parser-linux \
            -p irmind-mod-parser-syslog -p irmind-mod-parser-declarative \
            -p irmind-mod-parser-kubernetes -p irmind-mod-parser-falco
  evtx_linux_compatibility:
    needs: [dco, linux, release_binaries]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.platforms == 'true' && inputs.profile_linux != true && (needs.dco.outputs.release_build != 'true' || needs.release_binaries.result == 'success') }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.release_build == 'true'
        with: {name: irmind-linux, path: compatibility-bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.release_build != 'true'
        with: {name: evtx-linux-ci, path: compatibility-bin}
      - name: Test the same baseline binary on Ubuntu and pinned Debian/Fedora userspaces
        run: |
          chmod +x compatibility-bin/irmind-evtx
          python3 .github/scripts/check_evtx_linux.py compatibility-bin/irmind-evtx
      - name: Remove downloaded compatibility binaries
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; p=Path('compatibility-bin'); p.is_dir() and rmtree(p)"
  windows:
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.platforms == 'true' && inputs.profile_linux != true }}
    needs: [linux, dco]
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      IRMIND_EVTX_HELPER_TEST: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/ci/irmind-evtx.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@766a42937d994bd78bb4591385445c188ccb3f09 # 1.97.1
        with: {targets: x86_64-pc-windows-msvc, components: clippy}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.97.1-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-msvc-1.97.1-${{ needs.dco.outputs.cache_epoch }}
          add-rust-environment-hash-key: false
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - name: Test verified installer behavior without network
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_installers.py
      - name: Check the first-party unsafe boundary
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_unsafe_boundary.py
          python3 .github/scripts/check_unsafe_boundary.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_date_dependencies.py
          python3 .github/scripts/check_date_dependencies.py
      - name: Record the native Windows version
        run: python -c "import platform; print(platform.win32_ver())"
      - name: Lint the Windows native containment boundary
        run: cargo clippy -p irmind-process-containment --all-targets --profile ci --locked -- -D warnings
      - name: Build and test the separately resolved EVTX helper
        run: |
          python3 helpers/evtx/test.py
      - name: Inspect helper DLL imports after native startup failure
        if: failure()
        run: python3 .github/scripts/inspect_evtx_windows.py target/x86_64-pc-windows-msvc/ci/irmind-evtx.exe
      - name: Nextest (CI profile)
        env:
          IRMIND_CROSS_VERIFY: ${{ needs.dco.outputs.cross_verify }}
        run: |
          if [ "$IRMIND_CROSS_VERIFY" = true ]; then
            export IRMIND_PORTABLE_EXPORT_DIR="$GITHUB_WORKSPACE/portable-export"
          fi
          cargo nextest run --workspace --all-features --cargo-profile ci --locked --no-fail-fast
      - name: Parse the PowerShell installer without running it
        run: |
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { throw ($errors -join "`n") }'
      - name: Stage CLI test executable for cross-platform verification
        if: needs.dco.outputs.cross_verify == 'true'
        run: mkdir -p verify-bin && cp target/x86_64-pc-windows-msvc/ci/irmind.exe verify-bin/irmind.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: verify-test-windows, path: verify-bin/, if-no-files-found: error, retention-days: "${{ inputs.release_dry_run && '30' || '7' }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-linux, path: foreign-export}
      - name: Verify Linux export on Windows
        if: needs.dco.outputs.cross_verify == 'true'
        run: |
          ./verify-bin/irmind.exe verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true'
        with: {name: portable-export-windows, path: portable-export/, if-no-files-found: error, retention-days: "${{ inputs.release_dry_run && '30' || '7' }}"}
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('foreign-export', 'portable-export', 'verify-bin')) if p.is_dir()]"
  linux_verify_windows:
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.dco.outputs.cross_verify == 'true' }}
    needs: [windows, dco]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verify-test-linux, path: bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-windows, path: foreign-export}
      - run: chmod +x bin/irmind && bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('bin', 'foreign-export')) if p.is_dir()]"
  macos:
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.dco.outputs.platforms == 'true' && inputs.profile_linux != true }}
    needs: [linux, dco]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-26, target: aarch64-apple-darwin, arch: arm64}
          - {runner: macos-15-intel, target: x86_64-apple-darwin, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@766a42937d994bd78bb4591385445c188ccb3f09 # 1.97.1
        with: {targets: "${{ matrix.target }}"}
      - name: Keep only the pinned Rust toolchain for a stable cache key
        run: |
          rustup toolchain list | awk '{print $1}' | while read -r toolchain; do
            case "$toolchain" in 1.97.1-*) ;; *) rustup toolchain uninstall "$toolchain" ;; esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-${{ matrix.arch }}-1.97.1-${{ needs.dco.outputs.cache_epoch }}
          add-rust-environment-hash-key: false
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: cargo-nextest, fallback: none}
      - name: Test verified installer behavior without network
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_installers.py
      - name: Check the first-party unsafe boundary
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_unsafe_boundary.py
          python3 .github/scripts/check_unsafe_boundary.py
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_check_date_dependencies.py
          python3 .github/scripts/check_date_dependencies.py
      - name: Record the native macOS version
        run: sw_vers -productVersion
      - name: Build and test the separately resolved EVTX helper
        run: |
          python3 helpers/evtx/test.py
      - name: Inspect sandbox launch diagnostics after a native helper failure
        if: failure()
        run: /usr/bin/log show --last 2m --style compact --predicate '(process == "kernel" OR process == "sandboxd") AND eventMessage CONTAINS "irmind-evtx"'
      - run: cargo nextest run --workspace --all-features --cargo-profile ci --locked --test-threads 4
      - name: Stage CLI test executable for cross-platform verification
        if: needs.dco.outputs.cross_verify == 'true' && matrix.arch == 'arm64'
        run: mkdir -p verify-bin && cp target/${{ matrix.target }}/ci/irmind verify-bin/irmind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.dco.outputs.cross_verify == 'true' && matrix.arch == 'arm64'
        with: {name: verify-test-macos, path: verify-bin/, if-no-files-found: error, retention-days: "${{ inputs.release_dry_run && '30' || '7' }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dco.outputs.cross_verify == 'true' && matrix.arch == 'arm64'
        with: {name: portable-export-linux, path: foreign-export}
      - name: Verify Linux export on macOS
        if: needs.dco.outputs.cross_verify == 'true' && matrix.arch == 'arm64'
        run: verify-bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('foreign-export', 'verify-bin')) if p.is_dir()]"
  macos_verify_windows:
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.dco.outputs.cross_verify == 'true' }}
    needs: [macos, windows, dco]
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verify-test-macos, path: bin}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: portable-export-windows, path: foreign-export}
      - run: chmod +x bin/irmind && bin/irmind verify-export foreign-export/synthetic.irmind.json --expected-key "$(tr -d '\r\n' < foreign-export/expected-key.txt)"
      - name: Clean staging
        if: always()
        run: python -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('bin', 'foreign-export')) if p.is_dir()]"
  release_binaries:
    needs: dco
    if: ${{ needs.dco.outputs.release_build == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_binary_reproducibility && startsWith(github.ref, 'refs/heads/')) }}
    uses: ./.github/workflows/release-binaries.yml
    with:
      signing_rehearsal: ${{ github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true }}

  ci-matrix-gate:
    name: ${{ (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && 'ci-matrix-gate' || 'ci-matrix-gate (ignored label)' }}
    if: ${{ always() && github.event_name == 'pull_request' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') }}
    needs: [dco, linux, json_formats, windows, macos, evtx_linux_compatibility]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Require a successful selected matrix
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_CI: ${{ needs.dco.outputs.full_ci }}
          SCOPE_RESULT: ${{ needs.dco.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: python3 -B .github/scripts/check_review_matrix.py

  native_macos:
    needs: [dco, macos, release_binaries]
    if: ${{ false && !cancelled() && needs.release_binaries.result == 'success' && needs.macos.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.MACOS_NATIVE_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {artifact: arm64, architecture: aarch64}
          - {artifact: x86_64, architecture: x86_64}
    runs-on: macos-26
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: "irmind-macos-${{ matrix.artifact }}", path: native-macos}
      - name: Sign Developer ID binaries and notarize their disk image
        env:
          MACOS_NATIVE_SIGNING_ENABLED: ${{ vars.MACOS_NATIVE_SIGNING_ENABLED }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: python3 .github/scripts/sign_macos.py native-macos --architecture "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "irmind-macos-native-${{ matrix.architecture }}", path: native-macos/, if-no-files-found: error}
      - name: Remove temporary package copies
        if: always()
        run: rm -rf native-macos

  # Fulcio binds the certificate to this job's workflow path. Keep this job
  # here so installed verifiers retain the exact ci.yml signing identity.
  release:
    needs: [dco, linux, json_formats, release_binaries, windows, macos, native_macos, evtx_linux_compatibility, linux_verify_windows, macos_verify_windows]
    if: ${{ !cancelled() && (needs.native_macos.result == 'success' || needs.native_macos.result == 'skipped') && needs.linux.result == 'success' && needs.json_formats.result == 'success' && needs.release_binaries.result == 'success' && needs.release_binaries.outputs.portable_sigma_verified == 'true' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux_verify_windows.result == 'success' && needs.macos_verify_windows.result == 'success' && needs.evtx_linux_compatibility.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true)) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      homebrew_eligible: ${{ steps.homebrew.outputs.eligible }}
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-linux, path: artifacts/linux-x86_64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-linux-arm64, path: artifacts/linux-aarch64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-macos-arm64, path: artifacts/macos-aarch64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-macos-x86_64, path: artifacts/macos-x86_64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: irmind-windows, path: artifacts/windows-x86_64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: native-mapping-build-inputs, path: artifacts/native-mapping-build-inputs}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.native_macos.result == 'success'
        with: {name: irmind-macos-native-aarch64, path: artifacts/macos-aarch64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.native_macos.result == 'success'
        with: {name: irmind-macos-native-x86_64, path: artifacts/macos-x86_64}
      - name: Stage binaries and install scripts
        run: |
          mkdir -p release
          cp artifacts/linux-x86_64/irmind release/irmind-linux-x86_64
          cp artifacts/linux-x86_64/irmind-evtx release/irmind-evtx-linux-x86_64
          cp artifacts/linux-aarch64/irmind release/irmind-linux-aarch64
          cp artifacts/linux-aarch64/irmind-evtx release/irmind-evtx-linux-aarch64
          cp artifacts/macos-aarch64/irmind release/irmind-macos-aarch64
          cp artifacts/macos-aarch64/irmind-evtx release/irmind-evtx-macos-aarch64
          cp artifacts/macos-x86_64/irmind release/irmind-macos-x86_64
          cp artifacts/macos-x86_64/irmind-evtx release/irmind-evtx-macos-x86_64
          cp artifacts/windows-x86_64/irmind.exe release/irmind-windows-x86_64.exe
          cp artifacts/windows-x86_64/irmind-evtx.exe release/irmind-evtx-windows-x86_64.exe
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md install.sh install.ps1 release/
          for architecture in aarch64 x86_64; do
            if test -f "artifacts/macos-$architecture/IRMind-macos-$architecture.dmg"; then
              cp "artifacts/macos-$architecture/IRMind-macos-$architecture.dmg" release/
            fi
          done
      - name: Assemble the build environment inventory from all five targets
        run: |
          python3 .github/scripts/release_build_environment.py assemble artifacts release/BUILD-ENVIRONMENT.json
          cp artifacts/native-mapping-build-inputs/NATIVE-MAPPING-INPUTS.json release/NATIVE-MAPPING-INPUTS.json
      # WINDOWS NATIVE SIGNING (inactive, comment only): Authenticode is pending.
      # SignPath Foundation may be reevaluated after the public launch; a paid
      # signing subscription is another future option. No signing service or
      # secret is configured here. Any future integration needs reviewed tag-only
      # activation in the protected release environment and must replace BOTH
      # Windows executables before SBOMs, checksums, provenance and Sigstore.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release/IRMind-SBOM.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: helpers/evtx
          format: spdx-json
          output-file: release/IRMind-EVTX-SBOM.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with: {tool: 'cargo-geiger@0.13.0', fallback: cargo-binstall}
        env:
          BINSTALL_STRATEGIES: quick-install
          BINSTALL_DISABLE_STRATEGIES: compile
          BINSTALL_NO_DISCOVER_GITHUB_TOKEN: 'true'
          BINSTALL_DISABLE_TELEMETRY: 'true'
      - name: Verify the prebuilt unsafe-audit tool before execution
        run: |
          python3 - <<'PYTHON'
          import hashlib, shutil
          from pathlib import Path
          digest = hashlib.sha256(Path(shutil.which('cargo-geiger')).read_bytes()).hexdigest()
          assert digest in {
              '0c2c662ff98f3d206af915ba8a60cedb91eec7f75b856e80c6b8f6224176db16',
              'dc13a40bc8bfefc8cef434b3b2c1be3f1d3cf90494615533074d62758c746f62',
          }, 'unrecognized cargo-geiger 0.13.0 prebuilt binary'
          PYTHON
      - name: Inventory the separately locked helper native surface
        run: python3 .github/scripts/report_evtx_unsafe.py > release/EVTX-UNSAFE-REPORT.json
      - name: Audit the separately locked helper with cargo-geiger
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_normalize_evtx_geiger.py
          cargo geiger --manifest-path "$PWD/helpers/evtx/Cargo.toml" --all-targets --locked --output-format Json > "$RUNNER_TEMP/evtx-geiger.json" 2> "$RUNNER_TEMP/evtx-geiger.log"
          python3 .github/scripts/normalize_evtx_geiger.py --diagnostics "$RUNNER_TEMP/evtx-geiger.log" --inventory release/EVTX-UNSAFE-REPORT.json < "$RUNNER_TEMP/evtx-geiger.json" > release/EVTX-GEIGER-REPORT.json
          rm "$RUNNER_TEMP/evtx-geiger.json" "$RUNNER_TEMP/evtx-geiger.log"
      - name: Create and check the release checksum list
        run: |
          (cd release && sha256sum irmind-linux-x86_64 irmind-linux-aarch64 irmind-macos-aarch64 irmind-macos-x86_64 irmind-windows-x86_64.exe irmind-evtx-linux-x86_64 irmind-evtx-linux-aarch64 irmind-evtx-macos-aarch64 irmind-evtx-macos-x86_64 irmind-evtx-windows-x86_64.exe install.sh install.ps1 IRMind-SBOM.spdx.json IRMind-EVTX-SBOM.spdx.json EVTX-UNSAFE-REPORT.json EVTX-GEIGER-REPORT.json BUILD-ENVIRONMENT.json NATIVE-MAPPING-INPUTS.json LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md > SHA256SUMS)
          for architecture in aarch64 x86_64; do
            if test -f "release/IRMind-macos-$architecture.dmg"; then
              (cd release && sha256sum "IRMind-macos-$architecture.dmg" >> SHA256SUMS)
            fi
          done
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'release/irmind-*'}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*SBOM.spdx.json
            release/BUILD-ENVIRONMENT.json
            release/NATIVE-MAPPING-INPUTS.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.native_macos.result == 'success'
        with: {subject-path: 'release/IRMind-macos-*.dmg'}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.1.4'} # fixes GHSA-fx35-mq7g-6g98 in the bundled default
      - name: Sign the binaries, build environment inventory and checksums with GitHub OIDC
        run: |
          for file in release/irmind-linux-x86_64 release/irmind-linux-aarch64 release/irmind-macos-aarch64 release/irmind-macos-x86_64 release/irmind-windows-x86_64.exe release/irmind-evtx-linux-x86_64 release/irmind-evtx-linux-aarch64 release/irmind-evtx-macos-aarch64 release/irmind-evtx-macos-x86_64 release/irmind-evtx-windows-x86_64.exe release/BUILD-ENVIRONMENT.json release/NATIVE-MAPPING-INPUTS.json release/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          for dmg in release/IRMind-macos-*.dmg; do
            if test -f "$dmg"; then
              cosign sign-blob --yes --bundle "$dmg.sigstore.json" "$dmg"
            fi
          done
      - name: Verify every Sigstore bundle against this exact workflow ref
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          for file in release/irmind-linux-x86_64 release/irmind-linux-aarch64 release/irmind-macos-aarch64 release/irmind-macos-x86_64 release/irmind-windows-x86_64.exe release/irmind-evtx-linux-x86_64 release/irmind-evtx-linux-aarch64 release/irmind-evtx-macos-aarch64 release/irmind-evtx-macos-x86_64 release/irmind-evtx-windows-x86_64.exe release/BUILD-ENVIRONMENT.json release/NATIVE-MAPPING-INPUTS.json release/SHA256SUMS; do
            cosign verify-blob "$file" --bundle "$file.sigstore.json" --certificate-identity "$EXPECTED_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          for dmg in release/IRMind-macos-*.dmg; do
            if test -f "$dmg"; then
              cosign verify-blob "$dmg" --bundle "$dmg.sigstore.json" --certificate-identity "$EXPECTED_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true
        with: {name: signed-release-dry-run, path: release/, if-no-files-found: error, retention-days: 30}
      - name: Publish the signed prerelease only for an existing tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            notes=(--generate-notes)
            notes_file=".github/release-notes/$GITHUB_REF_NAME.md"
            if test -f "$notes_file"; then
              notes=(--notes-file "$notes_file")
            fi
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease "${notes[@]}" --title "IRMind $GITHUB_REF_NAME"
          fi
      - name: Add the public code signing policy to release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/irmind-release-notes.md"
          python3 .github/scripts/release_notes.py "$RUNNER_TEMP/irmind-release-notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/irmind-release-notes.md"
      - name: Clean release staging
        if: always()
        run: python3 -c "from pathlib import Path; from shutil import rmtree; [rmtree(p) for p in map(Path, ('release', 'artifacts')) if p.is_dir()]"
      - name: Select published stable releases for Homebrew
        id: homebrew
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release=$(gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease) &&
             eligible=$(printf '%s\n' "$release" | python3 -B .github/scripts/select_homebrew_release.py "$GITHUB_REF_NAME"); then
            printf '%s\n' "$eligible" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Homebrew eligibility could not be verified. The deployment will be skipped.'
          fi

  post_release:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true)) }}
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/release.yml
    with:
      signing_rehearsal: ${{ github.event_name == 'workflow_dispatch' && inputs.release_dry_run == true }}

  # Keep the protected deployment and its environment secret in the caller.
  update_homebrew:
    needs: [release, post_release]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && needs.release.outputs.homebrew_eligible == 'true' && needs.post_release.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Recheck release eligibility after deployment approval
        id: homebrew
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease |
            python3 -B .github/scripts/select_homebrew_release.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Ask the tap to verify and test this published release before updating
        if: steps.homebrew.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: gh workflow run update.yml --repo ns2switch/homebrew-irmind --ref main -f tag="$GITHUB_REF_NAME"

  release_profile:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_profile_benchmark || inputs.release_profile_reproducibility) && !inputs.release_dry_run && !inputs.profile_linux && startsWith(github.ref, 'refs/heads/') }}
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/release.yml
    with:
      profile_benchmark: ${{ inputs.release_profile_benchmark }}
      profile_reproducibility: ${{ inputs.release_profile_reproducibility }}
