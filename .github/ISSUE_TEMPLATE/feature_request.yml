name: Feature request
description: Suggest a user-facing improvement without real incident data.
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow with synthetic examples only.
        Do not include real incidents, credentials, personal data, or vulnerability details.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a synthetic example and any security impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
