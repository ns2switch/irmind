name: Bug report
description: Report a reproducible bug using synthetic data only.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real incident data, credentials, personal data, or vulnerability details.
        Report security vulnerabilities privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "commit hash or version"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic inputs and include the command or TUI action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Multiple or unknown
    validations:
      required: true
